name: Gerar PC

on:
  push:
    branches: [ wip-pc, android-app ]
    paths: [ 'pc/**', '.github/workflows/pc.yml' ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar o script do PC-Toolkit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pc/app/gerado | Out-Null
          python pc/ferramentas/preparar.py pc/script/PC-Toolkit.ps1 pc/app/gerado/toolkit.ps1

      - name: Conferir o PowerShell (erros de sintaxe)
        shell: powershell
        run: |
          $erros = $null
          foreach ($f in @('pc/app/gerado/toolkit.ps1', 'pc/script/app.ps1')) {
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$erros)
            if ($erros.Count -gt 0) { $erros | ForEach-Object { Write-Host "$f : $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          }
          Write-Host "PowerShell ok"

      - name: Compilar
        shell: pwsh
        run: dotnet build pc/app/SerpyraPC.csproj -c Release -o saida -nologo

      - name: Testar (fotos das telas e a ponte com o PowerShell)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pc/dist/telas | Out-Null
          $p = Start-Process saida/SerpyraToolkit.exe -ArgumentList '--fotos', (Resolve-Path pc/dist/telas) -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "o teste nao terminou" }
          Get-ChildItem pc/dist/telas | Format-Table Name, Length
          if (Test-Path pc/dist/telas/erros.txt) { Get-Content pc/dist/telas/erros.txt }
          # ponte: roda uma acao e confere as marcas de cor
          New-Item -ItemType Directory -Force ponte | Out-Null
          Copy-Item pc/script/app.ps1, pc/app/gerado/toolkit.ps1 ponte/
          $o = "`n" | powershell -NoProfile -ExecutionPolicy Bypass -File ponte/app.ps1 -Acao historico 2>&1 | Out-String
          $o.Substring(0, [Math]::Min(1500, $o.Length)) | Set-Content pc/dist/telas/ponte.txt
          Get-Content pc/dist/telas/ponte.txt

      - name: Publicar o .exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pc/dist | Out-Null
          Get-ChildItem pc/dist -File | Remove-Item -Force -ErrorAction SilentlyContinue
          Copy-Item saida/SerpyraToolkit.exe pc/dist/SerpyraToolkit-PC.exe
          $h = (Get-FileHash pc/dist/SerpyraToolkit-PC.exe -Algorithm SHA256).Hash.ToLower()
          $t = (Get-Item pc/dist/SerpyraToolkit-PC.exe).Length
          @{ versao = '2.0'; sha256 = $h; tamanho = $t; arquivo = 'SerpyraToolkit-PC.exe' } | ConvertTo-Json | Set-Content pc/dist/versao.json -Encoding utf8
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pc/dist
          git commit -m "PC: .exe gerado [skip ci]" ; if ($LASTEXITCODE -ne 0) { exit 0 }
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
