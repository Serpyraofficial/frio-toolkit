name: Gerar APK

on:
  push:
    branches: [ android-app ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (debug, ja assinado e instalavel)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PC-Toolkit-Mobile-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Guardar o APK na branch (pasta apk/)
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/PC-Toolkit-Mobile-4.5.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/PC-Toolkit-Mobile-4.5.apk
          git commit -m "APK gerado [skip ci]" || echo "sem mudancas"
          git push
