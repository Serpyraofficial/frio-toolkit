name: Build Frio Toolkit APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: frio-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Criar o projeto
        run: |
          set -e
          rm -rf FrioToolkit && mkdir -p FrioToolkit && cd FrioToolkit
          mkdir -p app app/src/main app/src/main/java/br/toolkit/frio app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxxhdpi
          cat > settings.gradle.kts <<'FRIO_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FrioToolkit"
          include(":app")
          FRIO_EOF
          cat > build.gradle.kts <<'FRIO_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          FRIO_EOF
          cat > gradle.properties <<'FRIO_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          FRIO_EOF
          cat > app/build.gradle.kts <<'FRIO_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "br.toolkit.frio"
              compileSdk = 34
              defaultConfig {
                  applicationId = "br.toolkit.frio"
                  minSdk = 30
                  targetSdk = 33
                  versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
                  versionName = "2." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
                  // repositorio e versao entram no app para a atualizacao automatica pelo GitHub Releases
                  buildConfigField("String", "REPO", "\"" + (System.getenv("GITHUB_REPOSITORY") ?: "") + "\"")
                  buildConfigField("int", "VERSAO", (System.getenv("GITHUB_RUN_NUMBER") ?: "0"))
              }
              buildFeatures { buildConfig = true }
              signingConfigs {
                  create("frio") {
                      // chave FIXA: as proximas atualizacoes instalam por cima, sem desinstalar
                      storeFile = file("frio.jks")
                      storePassword = "frio1234"
                      keyAlias = "frio"
                      keyPassword = "frio1234"
                  }
              }
              buildTypes {
                  getByName("debug") { signingConfig = signingConfigs.getByName("frio") }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          FRIO_EOF
          cat > app/src/main/AndroidManifest.xml <<'FRIO_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />

              <queries>
                  <package android:name="com.roblox.client" />
                  <package android:name="moe.shizuku.privileged.api" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Frio Toolkit"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|uiMode|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service android:name=".Vigia" android:exported="false" />

                  <provider
                      android:name=".Arquivos"
                      android:authorities="${applicationId}.arquivos"
                      android:exported="false"
                      android:grantUriPermissions="true" />

                  <receiver android:name=".Reinicio" android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          FRIO_EOF
          cat > app/src/main/java/br/toolkit/frio/Arquivos.java <<'FRIO_EOF'
          package br.toolkit.frio;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.ParcelFileDescriptor;

          import java.io.File;
          import java.io.FileNotFoundException;

          /** Entrega o APK baixado ao instalador do Android (plano B da atualizacao). So le, so esse arquivo. */
          public class Arquivos extends ContentProvider {
              @Override
              public boolean onCreate() { return true; }

              @Override
              public ParcelFileDescriptor openFile(Uri uri, String mode) throws FileNotFoundException {
                  if (!"atualizacao.apk".equals(uri.getLastPathSegment())) throw new FileNotFoundException("so o APK de atualizacao");
                  File f = new File(getContext().getCacheDir(), "atualizacao.apk");
                  return ParcelFileDescriptor.open(f, ParcelFileDescriptor.MODE_READ_ONLY);
              }

              @Override
              public String getType(Uri uri) { return "application/vnd.android.package-archive"; }

              @Override
              public Cursor query(Uri u, String[] p, String s, String[] a, String o) { return null; }

              @Override
              public Uri insert(Uri u, ContentValues v) { return null; }

              @Override
              public int delete(Uri u, String s, String[] a) { return 0; }

              @Override
              public int update(Uri u, ContentValues v, String s, String[] a) { return 0; }
          }
          FRIO_EOF
          cat > app/src/main/java/br/toolkit/frio/Atualizador.java <<'FRIO_EOF'
          package br.toolkit.frio;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.Signature;
          import android.net.Uri;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          import java.util.Arrays;

          /**
           * Atualizacao pelo GitHub Releases do proprio repositorio.
           *
           * Por que a versao anterior "atualizava" e continuava na mesma:
           *   o "pm install" rodava como processo do Shizuku PRESO ao app. Quando o Android
           *   substitui o app ele mata o app antigo, e o Shizuku mata junto os processos dele,
           *   abortando a instalacao. Nada conferia o resultado.
           *
           * Agora:
           *   1. baixa e CONFERE o APK (pacote, versao maior e mesma assinatura);
           *   2. copia para /data/local/tmp e dispara um instalador INDEPENDENTE (setsid),
           *      que sobrevive ao app ser fechado, grava um log e REABRE o app no final;
           *   3. quando o app volta, confere se a versao realmente mudou e mostra o erro exato se nao.
           *   Plano B: instalador do proprio Android (pede confirmacao na tela).
           */
          final class Atualizador {
              private Atualizador() { }

              static final String TMP_APK = "/data/local/tmp/frio-update.apk";
              static final String TMP_SH = "/data/local/tmp/frio-update.sh";
              static final String TMP_LOG = "/data/local/tmp/frio-update.log";

              static final class Release {
                  int versao;
                  String tag = "";
                  String nome = "";
                  String notas = "";
                  String apk = "";
                  String pagina = "";
                  long tamanho;

                  boolean nova() { return versao > versaoInstalada() && !apk.isEmpty(); }
              }

              static int versaoInstalada() { return BuildConfig.VERSAO; }

              static String repo() { return BuildConfig.REPO; }

              static volatile String ultimoErro = "";

              interface Progresso {
                  void msg(String s);
              }

              private static void dizer(Progresso p, String s) {
                  if (p != null) p.msg(s);
              }

              // ------------------------------------------------------------------ consulta ao GitHub
              private static HttpURLConnection abrir(String url, int leitura) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setConnectTimeout(20000);
                  c.setReadTimeout(leitura);
                  c.setUseCaches(false);
                  c.setInstanceFollowRedirects(true);
                  c.setRequestProperty("User-Agent", "FrioToolkit");
                  c.setRequestProperty("Cache-Control", "no-cache");
                  return c;
              }

              private static String get(String url) throws Exception {
                  HttpURLConnection c = abrir(url, 20000);
                  c.setRequestProperty("Accept", "application/vnd.github+json");
                  int code = c.getResponseCode();
                  if (code == 404) throw new Exception("repositorio ou release nao encontrado (o repositorio precisa ser PUBLICO para o app enxergar as versoes)");
                  if (code == 403 || code == 429) throw new Exception("limite de consultas do GitHub atingido; tente de novo em alguns minutos");
                  if (code != 200) throw new Exception("GitHub respondeu " + code);
                  BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  String l;
                  while ((l = r.readLine()) != null) sb.append(l).append('\n');
                  r.close();
                  c.disconnect();
                  return sb.toString();
              }

              /** Release mais nova com APK. null = nao conseguiu (motivo em ultimoErro). */
              static Release buscar() {
                  ultimoErro = "";
                  if (repo().isEmpty()) {
                      ultimoErro = "app compilado fora do GitHub Actions: atualizacao automatica desativada";
                      return null;
                  }
                  try {
                      JSONArray lista = new JSONArray(get("https://api.github.com/repos/" + repo() + "/releases?per_page=20&t=" + System.currentTimeMillis()));
                      Release melhor = null;
                      for (int i = 0; i < lista.length(); i++) {
                          JSONObject o = lista.optJSONObject(i);
                          if (o == null || o.optBoolean("draft") || o.optBoolean("prerelease")) continue;
                          String tag = o.optString("tag_name");
                          int v = numero(tag);
                          if (v <= 0 || (melhor != null && v <= melhor.versao)) continue;
                          Release r = new Release();
                          r.versao = v;
                          r.tag = tag;
                          r.nome = o.optString("name");
                          r.notas = o.optString("body");
                          r.pagina = o.optString("html_url");
                          JSONArray assets = o.optJSONArray("assets");
                          if (assets != null) {
                              for (int k = 0; k < assets.length(); k++) {
                                  JSONObject a = assets.optJSONObject(k);
                                  if (a != null && a.optString("name").toLowerCase().endsWith(".apk")) {
                                      r.apk = a.optString("browser_download_url");
                                      r.tamanho = a.optLong("size");
                                      break;
                                  }
                              }
                          }
                          if (!r.apk.isEmpty()) melhor = r;
                      }
                      if (melhor == null) ultimoErro = "nenhuma release com APK encontrada";
                      return melhor;
                  } catch (Exception e) {
                      ultimoErro = String.valueOf(e.getMessage());
                      return null;
                  }
              }

              private static int numero(String tag) {
                  String d = tag.replaceAll("[^0-9]", "");
                  if (d.isEmpty() || d.length() > 9) return -1;
                  try { return Integer.parseInt(d); } catch (NumberFormatException e) { return -1; }
              }

              // ------------------------------------------------------------------ download + conferencia
              static File arquivo(Context c) { return new File(c.getCacheDir(), "atualizacao.apk"); }

              static File baixar(Context c, Release r, Progresso p) throws Exception {
                  File arq = arquivo(c);
                  dizer(p, "Baixando a versao 2." + r.versao + " (" + Limpeza.tam(r.tamanho) + ")...");
                  HttpURLConnection con = abrir(r.apk, 60000);
                  int code = con.getResponseCode();
                  if (code != 200) throw new Exception("o download respondeu " + code);
                  InputStream in = con.getInputStream();
                  FileOutputStream out = new FileOutputStream(arq);
                  byte[] buf = new byte[65536];
                  int n;
                  long total = 0;
                  long proximo = 1048576L * 2;
                  while ((n = in.read(buf)) > 0) {
                      out.write(buf, 0, n);
                      total += n;
                      if (total >= proximo && r.tamanho > 0) {
                          dizer(p, "  " + (total * 100 / r.tamanho) + "%");
                          proximo += 1048576L * 2;
                      }
                  }
                  out.getFD().sync();
                  out.close();
                  in.close();
                  con.disconnect();
                  if (total < 100000 || (r.tamanho > 0 && total != r.tamanho)) throw new Exception("download incompleto (" + total + " de " + r.tamanho + " bytes)");
                  return arq;
              }

              private static byte[] digest(Signature[] s) {
                  if (s == null || s.length == 0) return null;
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      for (Signature x : s) md.update(x.toByteArray());
                      return md.digest();
                  } catch (Exception e) {
                      return null;
                  }
              }

              @SuppressWarnings("deprecation")
              private static Signature[] assinaturas(PackageInfo pi) {
                  if (pi == null) return null;
                  if (pi.signingInfo != null) return pi.signingInfo.getApkContentsSigners();
                  return pi.signatures;
              }

              /** Confere o APK baixado. Devolve null se esta tudo certo, ou o problema em portugues. */
              static String conferir(Context c, File apk, Release r) {
                  PackageManager pm = c.getPackageManager();
                  PackageInfo novo = pm.getPackageArchiveInfo(apk.getAbsolutePath(), PackageManager.GET_SIGNING_CERTIFICATES);
                  if (novo == null) return "o arquivo baixado nao e um APK valido (download corrompido). Tente de novo.";
                  if (!c.getPackageName().equals(novo.packageName)) return "o APK da release e de outro app (" + novo.packageName + ").";
                  long vNovo = novo.getLongVersionCode();
                  if (vNovo <= versaoInstalada()) {
                      return "o APK da release tem versionCode " + vNovo + ", que nao e maior que o instalado (" + versaoInstalada()
                              + "). Confira se o build.yml do repositorio e o mais recente.";
                  }
                  try {
                      PackageInfo atual = pm.getPackageInfo(c.getPackageName(), PackageManager.GET_SIGNING_CERTIFICATES);
                      byte[] a = digest(assinaturas(atual));
                      byte[] b = digest(assinaturas(novo));
                      if (a != null && b != null && !Arrays.equals(a, b)) {
                          return "ASSINATURA_DIFERENTE";
                      }
                  } catch (Exception e) { }
                  return null;
              }

              // ------------------------------------------------------------------ instalacao
              private static SharedPreferences prefs(Context c) { return Jogo.prefs(c); }

              /**
               * Fluxo completo. Devolve true se o instalador independente foi disparado
               * (o app vai fechar e reabrir sozinho ja atualizado).
               */
              static boolean instalar(Context c, Release r, Progresso p) {
                  try {
                      File apk = baixar(c, r, p);
                      dizer(p, "Conferindo o arquivo...");
                      String prob = conferir(c, apk, r);
                      if ("ASSINATURA_DIFERENTE".equals(prob)) {
                          ultimoErro = "assinatura diferente";
                          dizer(p, "✖ Esta versao foi assinada com outra chave, entao o Android NAO deixa instalar por cima.\n"
                                  + "   Isso acontece quando o build.yml do repositorio nao e o do Frio Toolkit (chave frio.jks).\n"
                                  + "   Solucao (so uma vez): desinstale o Frio Toolkit e instale o APK da release manualmente.");
                          return false;
                      }
                      if (prob != null) {
                          ultimoErro = prob;
                          dizer(p, "✖ " + prob);
                          return false;
                      }
                      if (!Sh.pronto()) {
                          dizer(p, "Shizuku desconectado: vou usar o instalador do Android (toque em Instalar na tela que abrir).");
                          return instalarPeloAndroid(c);
                      }
                      dizer(p, "Copiando para a area de instalacao...");
                      String cp = Sh.enviarArquivo(apk, TMP_APK);
                      long tam = Sh.inteiro(Sh.run("stat -c %s " + TMP_APK), -1);
                      if (tam != apk.length()) {
                          dizer(p, "Nao consegui copiar o APK pelo Shizuku (" + cp + "). Usando o instalador do Android...");
                          return instalarPeloAndroid(c);
                      }
                      String eu = c.getPackageName();
                      String script = "#!/system/bin/sh\n"
                              + "sleep 1\n"
                              + "echo \"inicio $(date)\" > " + TMP_LOG + "\n"
                              + "pm install -r -t " + TMP_APK + " >> " + TMP_LOG + " 2>&1\n"
                              + "echo \"codigo $?\" >> " + TMP_LOG + "\n"
                              + "dumpsys package " + eu + " | grep -m 1 versionCode >> " + TMP_LOG + "\n"
                              + "echo FIM >> " + TMP_LOG + "\n"
                              + "rm -f " + TMP_APK + "\n"
                              + "sleep 1\n"
                              + "am start -n " + eu + "/.MainActivity >/dev/null 2>&1\n";
                      Sh.escreverTexto(script, TMP_SH);
                      prefs(c).edit().putInt("atualizando_para", r.versao).putLong("atualizando_desde", System.currentTimeMillis()).apply();
                      avisar(c, "Atualizando para a versao 2." + r.versao, "O app vai fechar e abrir sozinho ja atualizado.");
                      dizer(p, "Instalando a 2." + r.versao + "... o app vai FECHAR e ABRIR SOZINHO ja atualizado.");
                      String lancou = Sh.run("rm -f " + TMP_LOG + "; chmod 755 " + TMP_SH + "; "
                              + "if command -v setsid >/dev/null 2>&1; then setsid sh " + TMP_SH + " </dev/null >/dev/null 2>&1 & "
                              + "else nohup sh " + TMP_SH + " </dev/null >/dev/null 2>&1 & fi; echo LANCADO");
                      if (!lancou.contains("LANCADO")) {
                          prefs(c).edit().remove("atualizando_para").apply();
                          dizer(p, "Nao consegui iniciar o instalador (" + lancou + "). Usando o instalador do Android...");
                          return instalarPeloAndroid(c);
                      }
                      // Enquanto este processo ainda existe, acompanha o log: se der erro, mostra na hora.
                      long fim = System.currentTimeMillis() + 120000L;
                      while (System.currentTimeMillis() < fim) {
                          Thread.sleep(1500);
                          String log = Sh.run("cat " + TMP_LOG + " 2>/dev/null");
                          if (log.contains("FIM")) {
                              String erro = explicar(log);
                              if (erro != null) {
                                  prefs(c).edit().remove("atualizando_para").apply();
                                  ultimoErro = erro;
                                  dizer(p, "✖ A instalacao falhou: " + erro);
                                  return false;
                              }
                              dizer(p, "✔ Instalado. Reabrindo...");
                              return true;
                          }
                      }
                      dizer(p, "A instalacao esta demorando. Se o app nao reabrir sozinho, abra de novo: ele confere a versao.");
                      return true;
                  } catch (Exception e) {
                      ultimoErro = String.valueOf(e.getMessage());
                      dizer(p, "✖ Falha na atualizacao: " + ultimoErro);
                      prefs(c).edit().remove("atualizando_para").apply();
                      return false;
                  }
              }

              /** Traduz o resultado do pm install. null = sucesso. */
              static String explicar(String log) {
                  if (log == null) return "sem resultado";
                  if (log.contains("Success")) return null;
                  if (log.contains("INSTALL_FAILED_UPDATE_INCOMPATIBLE") || log.contains("signatures do not match"))
                      return "assinatura diferente da instalada. Desinstale o Frio Toolkit uma vez e instale o APK da release manualmente.";
                  if (log.contains("INSTALL_FAILED_VERSION_DOWNGRADE")) return "a versao da release e mais antiga que a instalada.";
                  if (log.contains("INSTALL_FAILED_INSUFFICIENT_STORAGE")) return "pouco espaco livre. Faca a Limpeza rapida e tente de novo.";
                  if (log.contains("INSTALL_FAILED_USER_RESTRICTED"))
                      return "o celular bloqueia instalacao pela depuracao. Em Opcoes do desenvolvedor, ligue 'Instalar via USB' (Xiaomi/Redmi/POCO) e tente de novo.";
                  if (log.contains("INSTALL_FAILED_VERIFICATION_FAILURE") || log.contains("VERIFICATION"))
                      return "o Play Protect bloqueou. Em Opcoes do desenvolvedor desligue 'Verificar apps via USB' ou use o instalador do Android.";
                  if (log.contains("INSTALL_PARSE_FAILED")) return "APK corrompido no download. Tente de novo.";
                  int i = log.indexOf("Failure");
                  if (i >= 0) return log.substring(i).split("\n")[0];
                  return "resultado desconhecido: " + log.trim();
              }

              /** Plano B: abre o instalador do proprio Android com o APK baixado. */
              static boolean instalarPeloAndroid(Context c) {
                  File apk = arquivo(c);
                  if (!apk.exists()) return false;
                  if (!c.getPackageManager().canRequestPackageInstalls() && Sh.pronto()) {
                      Sh.run("appops set " + c.getPackageName() + " REQUEST_INSTALL_PACKAGES allow");
                  }
                  Intent i = new Intent(Intent.ACTION_VIEW);
                  i.setDataAndType(Uri.parse("content://" + c.getPackageName() + ".arquivos/atualizacao.apk"), "application/vnd.android.package-archive");
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      c.startActivity(i);
                      prefs(c).edit().putInt("atualizando_para", 0).apply();
                      return true;
                  } catch (Exception e) {
                      ultimoErro = "nao consegui abrir o instalador do Android: " + e.getMessage();
                      return false;
                  }
              }

              /**
               * Chamado quando o app abre: confere se a ultima atualizacao realmente aconteceu.
               * Devolve a mensagem para mostrar (ou null se nao havia atualizacao pendente).
               */
              static String conferirResultado(Context c) {
                  SharedPreferences sp = prefs(c);
                  if (!sp.contains("atualizando_para")) return null;
                  int alvo = sp.getInt("atualizando_para", 0);
                  long desde = sp.getLong("atualizando_desde", 0);
                  if (alvo > 0 && versaoInstalada() >= alvo) {
                      sp.edit().remove("atualizando_para").remove("atualizando_desde").putInt("atualizado_ok", alvo).apply();
                      if (Sh.pronto()) Sh.run("rm -f " + TMP_SH + " " + TMP_APK);
                      try { arquivo(c).delete(); } catch (Exception e) { }
                      return "✔ Atualizado com sucesso para a versao 2." + versaoInstalada() + ".";
                  }
                  if (alvo == 0) {
                      sp.edit().remove("atualizando_para").apply();
                      return null;
                  }
                  if (System.currentTimeMillis() - desde < 25000L) return null; // ainda instalando
                  String log = Sh.pronto() ? Sh.run("cat " + TMP_LOG + " 2>/dev/null") : "";
                  sp.edit().remove("atualizando_para").remove("atualizando_desde").apply();
                  String erro = log.isEmpty() ? "o instalador nao deixou registro (o Shizuku pode ter sido desligado no meio)." : explicar(log);
                  if (erro == null) erro = "o Android disse que instalou, mas a versao nao mudou. Feche o app pelos Recentes e abra de novo.";
                  ultimoErro = erro;
                  return "✖ A atualizacao para 2." + alvo + " NAO foi aplicada: " + erro;
              }

              static void avisar(Context c, String titulo, String txt) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel("update", "Atualizacoes", NotificationManager.IMPORTANCE_DEFAULT));
                  Notification n = new Notification.Builder(c, "update")
                          .setContentTitle(titulo)
                          .setContentText(txt)
                          .setSmallIcon(android.R.drawable.stat_sys_download_done)
                          .setAutoCancel(true)
                          .build();
                  nm.notify(9, n);
              }
          }
