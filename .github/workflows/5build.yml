              // =================================================================== atualizacao pelo GitHub
              private void procurarAtualizacao(final boolean manual) {
                  if (Atualizador.repo().isEmpty()) { if (manual) aviso(Atualizador.ultimoErro.isEmpty() ? "Atualizacao indisponivel neste build." : Atualizador.ultimoErro); return; }
                  long ult = prefs.getLong("ult_busca_update", 0);
                  if (!manual && System.currentTimeMillis() - ult < 3L * 3600000L) return;
                  if (buscandoUpdate) return;
                  buscandoUpdate = true;
                  prefs.edit().putLong("ult_busca_update", System.currentTimeMillis()).apply();
                  if (manual) log("Procurando atualizacao em github.com/" + Atualizador.repo() + " ...");
                  bg.execute(() -> {
                      final Atualizador.Release r = Atualizador.buscar();
                      buscandoUpdate = false;
                      runOnUiThread(() -> {
                          if (r == null) {
                              if (manual) log("Nao consegui verificar: " + Atualizador.ultimoErro);
                              if (hUpdate != null && manual) hUpdate.setText("Nao consegui verificar: " + Atualizador.ultimoErro);
                              return;
                          }
                          if (!r.nova()) {
                              if (hUpdate != null) hUpdate.setText("✔ Voce esta na versao mais nova (2." + Atualizador.versaoInstalada() + ").");
                              if (manual) log("Ja esta na versao mais nova.");
                              return;
                          }
                          if (hUpdate != null) hUpdate.setText("Nova versao disponivel: 2." + r.versao);
                          if (prefs.getBoolean("auto_update", true) && !manual && !Vigia.emSessao) {
                              log("Nova versao 2." + r.versao + " encontrada: atualizando sozinho...");
                              baixarEInstalar(r);
                          } else {
                              String notas = r.notas.length() > 900 ? r.notas.substring(0, 900) + "..." : r.notas;
                              new AlertDialog.Builder(this, DIALOGO).setTitle("Nova versao 2." + r.versao)
                                      .setMessage("Instalada: 2." + Atualizador.versaoInstalada() + "\n\n" + notas)
                                      .setPositiveButton("Atualizar agora", (d, w) -> baixarEInstalar(r))
                                      .setNegativeButton("Depois", null).show();
                          }
                      });
                  });
              }

              private volatile boolean instalando = false;

              private void baixarEInstalar(final Atualizador.Release r) {
                  if (Vigia.emSessao) { aviso("Termine a partida antes de atualizar."); return; }
                  if (instalando) { aviso("A atualizacao ja esta em andamento."); return; }
                  instalando = true;
                  if (!"home".equals(tela)) mostrar("home");
                  log("▶ Atualizando para 2." + r.versao + (Sh.pronto() ? " pelo Shizuku (automatico)." : " pelo instalador do Android (Shizuku desconectado)."));
                  bg.execute(() -> {
                      boolean ok;
                      try { ok = Atualizador.instalar(this, r, this::log); } finally { instalando = false; }
                      if (ok) return;
                      final String erro = Atualizador.ultimoErro;
                      runOnUiThread(() -> new AlertDialog.Builder(this, DIALOGO).setTitle("Nao consegui atualizar")
                              .setMessage(erro + "\n\nAlternativas:")
                              .setPositiveButton("Instalador do Android", (d, w) -> bg.execute(() -> {
                                  if (!Atualizador.instalarPeloAndroid(this)) log("✖ " + Atualizador.ultimoErro);
                              }))
                              .setNeutralButton("Abrir a pagina da versao", (d, w) -> abrir(new Intent(Intent.ACTION_VIEW, Uri.parse(r.pagina))))
                              .setNegativeButton("Fechar", null).show());
                  });
              }

