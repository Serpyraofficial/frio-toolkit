              private View chave(String titulo, String explica, final String key, boolean padrao) {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(0, dp(6), 0, dp(6));
                  Switch s = new Switch(this);
                  s.setText(titulo);
                  s.setTextColor(Ui.TEXTO);
                  s.setTextSize(15);
                  s.setChecked(prefs.getBoolean(key, padrao));
                  int[][] est = { { android.R.attr.state_checked }, {} };
                  s.setThumbTintList(new ColorStateList(est, new int[] { Ui.VERDE, Ui.CINZA }));
                  s.setTrackTintList(new ColorStateList(est, new int[] { Ui.alfa(Ui.VERDE, 0x88), Ui.alfa(Ui.CINZA, 0x66) }));
                  s.setOnCheckedChangeListener((b, on) -> prefs.edit().putBoolean(key, on).apply());
                  l.addView(s);
                  if (explica != null && !explica.isEmpty()) l.addView(Ui.texto(this, explica, 12.5f, Ui.SUB, false));
                  return l;
              }

              private View ciclo(final String titulo, final String key, final int[] ops, int padrao, final String un, String explica) {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(0, dp(4), 0, dp(4));
                  final Button b = Ui.botaoSec(this, "", Ui.VERDE, null);
                  final int[] atual = { prefs.getInt(key, padrao) };
                  final Runnable rot = () -> b.setText(titulo + ":  " + ("%".equals(un) && atual[0] >= 100 ? "nao mexer" : atual[0] + un) + "   ⟳");
                  rot.run();
                  b.setOnClickListener(v -> {
                      int idx = 0;
                      for (int i = 0; i < ops.length; i++) if (ops[i] == atual[0]) idx = i;
                      atual[0] = ops[(idx + 1) % ops.length];
                      prefs.edit().putInt(key, atual[0]).apply();
                      rot.run();
                  });
                  l.addView(b);
                  if (explica != null && !explica.isEmpty()) l.addView(Ui.texto(this, explica, 12.5f, Ui.SUB, false));
                  return l;
              }

