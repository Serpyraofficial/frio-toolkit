              private void varrer() {
                  if (!exigeShizuku()) return;
                  if (ocupado) { aviso("Aguarde a tarefa atual terminar."); return; }
                  ocupado = true;
                  log("🔍 Varrendo...");
                  bg.execute(() -> {
                      final List<Seguranca.Achado> l;
                      try { l = Seguranca.varrer(this); } finally { ocupado = false; }
                      runOnUiThread(() -> mostrarAchados(l));
                  });
              }

              private void mostrarAchados(List<Seguranca.Achado> l) {
                  if (resultados == null) return;
                  resultados.removeAllViews();
                  int a = 0, m = 0, b = 0;
                  for (Seguranca.Achado x : l) { if (x.sev >= 3) a++; else if (x.sev == 2) m++; else if (x.sev == 1) b++; }
                  LinearLayout res = Ui.card(this);
                  res.addView(Ui.tituloCard(this, a + m + b == 0 ? "✔ Nada suspeito encontrado" : String.format(Locale.US, "Resultado: %d alto • %d medio • %d baixo", a, m, b)));
                  if (a + m + b == 0) res.addView(p("Nenhum dos recursos usados por malware esta sendo usado por apps desconhecidos."));
                  resultados.addView(res);
                  for (final Seguranca.Achado x : l) {
                      int cor = x.sev >= 3 ? Ui.VERMELHO : (x.sev == 2 ? Ui.LARANJA : (x.sev == 1 ? Ui.AMARELO : Ui.CINZA));
                      String sev = x.sev >= 3 ? "ALTO" : (x.sev == 2 ? "MEDIO" : (x.sev == 1 ? "BAIXO" : "INFO"));
                      LinearLayout c = Ui.card(this);
                      c.addView(Ui.chip(this, sev, cor));
                      TextView t = Ui.texto(this, x.titulo, 15, Ui.TEXTO, true);
                      t.setPadding(0, dp(6), 0, dp(2));
                      c.addView(t);
                      c.addView(p(x.detalhe));
                      if ("acessibilidade".equals(x.tipo)) {
                          c.addView(Ui.botaoSec(this, "Desativar a acessibilidade dele", Ui.VERMELHO, v -> confirmar("Desativar acessibilidade",
                                  "Desativar o servico de acessibilidade de " + Jogo.nome(this, x.pkg) + "? (Da para voltar em Desfazer.)",
                                  () -> bg.execute(() -> log(Seguranca.desativarAcessibilidade(this, x.extra))))));
                      } else if ("notificacao".equals(x.tipo)) {
                          c.addView(Ui.botaoSec(this, "Abrir acesso a notificacoes", Ui.AMARELO, v -> abrir(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))));
                      } else if ("admin".equals(x.tipo)) {
                          c.addView(Ui.botaoSec(this, "Abrir administradores do aparelho", Ui.AMARELO, v -> abrir(new Intent(Settings.ACTION_SECURITY_SETTINGS))));
                      } else if ("overlay".equals(x.tipo)) {
                          c.addView(Ui.botaoSec(this, "Revogar essa permissao", Ui.AMARELO, v -> bg.execute(() -> log("Revogado: " + x.extra + " de " + x.pkg + " " + Seguranca.revogar(this, x.pkg, x.extra)))));
                      }
                      if (x.pkg != null && !"info".equals(x.tipo)) {
                          c.addView(Ui.botaoSec(this, "Ver o app nas configuracoes", Ui.SUB, v -> abrir(detalhesApp(x.pkg))));
                          if (x.sev >= 1) c.addView(Ui.botaoSec(this, "Desinstalar", Ui.VERMELHO, v -> confirmar("Desinstalar",
                                  "Desinstalar " + Jogo.nome(this, x.pkg) + "? Os dados dele serao apagados.",
                                  () -> bg.execute(() -> log("Desinstalar " + x.pkg + ": " + Sh.run("pm uninstall " + x.pkg))))));
                      }
                      resultados.addView(c);
                  }
                  log("Varredura concluida: " + l.size() + " item(ns).");
              }

              // =================================================================== TELA: sistema
              private List<Plano.Item> planoSistema() {
                  List<Plano.Item> l = new ArrayList<Plano.Item>();
                  final String eu = getPackageName();
                  String an = Jogo.valor(Sh.run("settings get global window_animation_scale"), "1.0");
                  if (!an.equals("0.5")) {
                      l.add(new Plano.Item("anim", "Animacoes em 0.5x", "Atual: " + an + "x → 0.5x. Menus e trocas de tela ficam mais rapidos e a GPU trabalha menos.",
                              true, () -> animacoes("0.5")));
                  }
                  String hz = Jogo.valor(Sh.run("settings get system peak_refresh_rate"), "padrao do aparelho");
                  l.add(new Plano.Item("hz", "Tela sempre em 60 Hz (fora do jogo tambem)",
                          "Atual: " + hz + " → 60 Hz. Mais frio e a bateria dura mais; a rolagem fica um pouco menos suave.", false, () -> {
                              String r = Mudancas.setting(this, Mudancas.FIXO, "system", "peak_refresh_rate", "60.0", "Taxa de atualizacao (fixo)");
                              if (Sh.inteiro(Sh.run("settings get system min_refresh_rate"), 0) > 60)
                                  r += Mudancas.setting(this, Mudancas.FIXO, "system", "min_refresh_rate", "60.0", "Taxa minima (fixo)");
                              return r;
                          }));
                  String noite = Sh.run("cmd uimode night");
                  final String origNoite = noite.contains("yes") ? "yes" : (noite.contains("auto") ? "auto" : "no");
                  if (!"yes".equals(origNoite)) {
                      l.add(new Plano.Item("noite", "Modo escuro", "Atual: " + origNoite + " → escuro. Em telas OLED/AMOLED preto gasta menos energia (menos calor).", false,
                              () -> Mudancas.aplicar(this, Mudancas.FIXO, "uimode", "Modo escuro", "cmd uimode night yes", "cmd uimode night " + origNoite)));
                  }
                  l.add(itemCmd("doze", "Proteger o Modo Jogo da economia de bateria",
                          "Coloca o Frio Toolkit na lista de excecoes, para o Android nao fecha-lo no meio da partida.", true,
                          "dumpsys deviceidle whitelist +" + eu));
                  return l;
              }

              private String animacoes(String v) {
                  StringBuilder sb = new StringBuilder();
                  for (String k : new String[] { "window_animation_scale", "transition_animation_scale", "animator_duration_scale" }) {
                      sb.append(Mudancas.setting(this, Mudancas.FIXO, "global", k, v, "Animacoes (" + k + ")"));
                  }
                  return sb.toString();
              }

              private String restaurarAnimacoes() {
                  StringBuilder sb = new StringBuilder();
                  for (String k : new String[] { "window_animation_scale", "transition_animation_scale", "animator_duration_scale" }) {
                      sb.append(Mudancas.restaurarChave(this, "settings:global:" + k)).append('\n');
                  }
                  return sb.toString().trim();
              }

