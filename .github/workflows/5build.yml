                  if (ocupado) { aviso("Aguarde a tarefa atual terminar."); return; }
                  log("… preparando: " + titulo);
                  bg.execute(() -> {
                      final List<Plano.Item> l = f.get();
                      runOnUiThread(() -> mostrarPlano(titulo, intro, l, null));
                  });
              }

