              private void testeEstresse() {
                  if (estressando) {
                      estressando = false;
                      aviso("Parando o teste...");
                      return;
                  }
                  confirmar("Teste de estresse",
                          "Coloca todos os nucleos da CPU em 100% por 60 segundos e mede temperatura e frequencia. "
                                  + "Para sozinho se a CPU passar de 95°C ou a bateria de 46°C. Toque no botao de novo para parar antes. "
                                  + "Use para comparar antes/depois (sem capinha, depois de limpar, etc.).",
                          this::iniciarEstresse);
              }

              private void iniciarEstresse() {
                  estressando = true;
                  final int n = Runtime.getRuntime().availableProcessors();
                  for (int i = 0; i < n; i++) {
                      Thread t = new Thread(() -> {
                          double x = 1.0;
                          while (estressando) {
                              for (int k = 0; k < 200000; k++) x = Math.sqrt(x + k) * 1.0000001;
                              if (x < 0) log("");
                          }
                      });
                      t.setDaemon(true);
                      t.start();
                  }
                  new Thread(() -> {
                      boolean sh = Sh.pronto();
                      Termica.Leitura a = Termica.ler(this, sh);
                      log(String.format(Locale.US, "🧪 Estresse iniciado (%d nucleos). Antes: CPU %s, bateria %s", n, Termica.fmt(a.cpu), Termica.fmt(a.bateria)));
                      float pc = a.cpu;
                      float pb = a.bateria;
                      int fRef = 0;
                      int fMin = 0;
                      boolean abortou = false;
                      long fim = System.currentTimeMillis() + 60000L;
                      while (estressando && System.currentTimeMillis() < fim) {
                          try { Thread.sleep(3000); } catch (InterruptedException e) { break; }
                          Termica.Leitura l = Termica.ler(this, sh);
                          int f = sh ? Termica.freqMaxMHz() : 0;
                          if (f > 0 && fRef == 0) fRef = f;
                          if (f > 0 && (fMin == 0 || f < fMin)) fMin = f;
                          pc = Math.max(pc, l.cpu);
                          pb = Math.max(pb, l.bateria);
                          log(String.format(Locale.US, " %2ds  CPU %s  bateria %s%s", (fim - System.currentTimeMillis()) / 1000L,
                                  Termica.fmt(l.cpu), Termica.fmt(l.bateria), f > 0 ? "  " + f + " MHz" : ""));
                          if (l.cpu >= 95f || l.bateria >= 46f) { abortou = true; break; }
                      }
                      estressando = false;
                      StringBuilder r = new StringBuilder("=== RESULTADO ===\n");
                      r.append(String.format(Locale.US, "Pico: CPU %s, bateria %s\n", Termica.fmt(pc), Termica.fmt(pb)));
                      int queda = (fRef > 0 && fMin > 0) ? (fRef - fMin) * 100 / fRef : -1;
                      if (queda >= 0) r.append("Queda de frequencia sob calor: ").append(queda).append("%\n");
                      if (abortou) r.append("Parou por seguranca: esquentou demais. Tire a capinha, nao jogue carregando e use o perfil Forte.\n");
                      else if (queda >= 25) r.append("O celular reduziu bastante o desempenho por calor (throttling). O Modo Jogo com 60 Hz + resolucao menor ajuda muito.\n");
                      else r.append("Segurou bem a carga. ✔\n");
                      log(r.toString());
                  }).start();
              }

