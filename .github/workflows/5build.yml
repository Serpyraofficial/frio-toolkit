              static volatile String estado = "parado";

              private static final long CICLO_MS = 4000L;
              private static final long CONFIRMA_FECHADO_MS = 30000L;
              private static final long FUNDO_MAX_MS = 180000L;
              private static final long CARENCIA_MS = 45000L;
              private static final long TERMICA_MS = 12000L;

              private ScheduledExecutorService ex;
              private final Handler h = new Handler(Looper.getMainLooper());
              private WindowManager wm;
              private TextView selo;

              private String jogoAtual;
              private String candidato;
              private int vistoNaFrente;
              private long semProcessoDesde;
              private long noFundoDesde;
              private long carenciaAte;
              private boolean forte;
              private int quentes;
              private long inicio;
              private float picoBat;
              private float picoCpu;
              private long ultimaTermica;
              private Termica.Leitura leitura;
              private boolean avisouShizuku;
              private long proximaChecagemUpdate;

              @Override
              public IBinder onBind(Intent i) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel("vigia", "Vigia do jogo", NotificationManager.IMPORTANCE_LOW));
                  nm.createNotificationChannel(new NotificationChannel("alerta", "Alertas de calor", NotificationManager.IMPORTANCE_HIGH));
                  nm.createNotificationChannel(new NotificationChannel("sessao", "Inicio e fim de partida", NotificationManager.IMPORTANCE_DEFAULT));
                  startForeground(1, nota("Vigiando seus jogos..."));
                  ativo = true;
                  estado = "vigiando";
                  wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  // Se o Android reiniciou o servico no meio de uma partida, adota a sessao em vez de reaplicar tudo.
                  if (Mudancas.contar(this, Mudancas.SESSAO) > 0) {
                      emSessao = true;
                      jogoAtual = Jogo.prefs(this).getString("sessao_jogo", null);
                      inicio = Jogo.prefs(this).getLong("sessao_inicio", System.currentTimeMillis());
                      carenciaAte = System.currentTimeMillis() + CARENCIA_MS;
                  }
                  proximaChecagemUpdate = System.currentTimeMillis() + 60000L;
                  ex = Executors.newSingleThreadScheduledExecutor();
                  ex.scheduleWithFixedDelay(new Runnable() {
                      public void run() {
                          try { tick(); } catch (Throwable t) { estado = "erro: " + t.getMessage(); }
                      }
                  }, 1000L, CICLO_MS, TimeUnit.MILLISECONDS);
              }

              @Override
              public int onStartCommand(Intent i, int f, int id) {
                  return START_STICKY;
              }

              // ------------------------------------------------------------------ notificacoes
              private Notification nota(String txt) {
                  PendingIntent abrir = PendingIntent.getActivity(this, 0, new Intent(this, MainActivity.class),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  return new Notification.Builder(this, "vigia")
                          .setContentTitle("Frio Toolkit")
                          .setContentText(txt)
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentIntent(abrir)
                          .setOnlyAlertOnce(true)
                          .setOngoing(true)
                          .build();
              }

              private String ultimoTexto = "";

              private void atualizar(String txt) {
                  estado = txt;
                  if (txt.equals(ultimoTexto)) return;
                  ultimoTexto = txt;
                  getSystemService(NotificationManager.class).notify(1, nota(txt));
              }

              private void alerta(String canal, int id, String titulo, String txt, boolean vibrar) {
                  Notification n = new Notification.Builder(this, canal)
                          .setContentTitle(titulo)
                          .setContentText(txt)
                          .setStyle(new Notification.BigTextStyle().bigText(txt))
                          .setSmallIcon(android.R.drawable.stat_sys_warning)
                          .setAutoCancel(true)
                          .build();
                  getSystemService(NotificationManager.class).notify(id, n);
                  if (vibrar) {
                      Vibrator v = getSystemService(Vibrator.class);
                      if (v != null) v.vibrate(VibrationEffect.createOneShot(600, VibrationEffect.DEFAULT_AMPLITUDE));
                  }
              }

              private static String linha(Termica.Leitura l) {
                  if (l == null) return "";
                  StringBuilder sb = new StringBuilder();
                  if (l.cpu > 0) sb.append("CPU ").append(Termica.fmt(l.cpu)).append("  ");
                  if (l.gpu > 0) sb.append("GPU ").append(Termica.fmt(l.gpu)).append("  ");
                  sb.append("Bat ").append(Termica.fmt(l.bateria));
                  if (l.carregando) sb.append("  ⚡");
                  return sb.toString();
              }

              // ------------------------------------------------------------------ ciclo
              private void tick() {
                  long agora = System.currentTimeMillis();
                  SharedPreferences p = Jogo.prefs(this);

                  if (!Sh.pronto()) {
                      // Nao conclui nada sem o Shizuku: mantem a partida e o perfil como estao.
                      atualizar(emSessao ? "Shizuku caiu: mantendo o perfil do jogo ate ele voltar"
                              : "Shizuku desconectado: abra o Shizuku e toque em Iniciar");
                      if (emSessao && !avisouShizuku) {
                          avisouShizuku = true;
                          alerta("sessao", 3, "Shizuku desconectou",
                                  "Mantive o perfil do jogo. Abra o Shizuku e toque em Iniciar; eu continuo de onde parei.", false);
                      }
                      return;
                  }
                  avisouShizuku = false;

                  if (leitura == null || agora - ultimaTermica >= TERMICA_MS) {
                      leitura = Termica.ler(this, true);
                      ultimaTermica = agora;
                  }

                  List<String> jogos = Jogo.jogos(this);
                  Jogo.Deteccao d = Jogo.detectar(jogos);
                  if (!d.ok) {
                      atualizar(emSessao ? estado : "Verificando...");
                      return; // falha momentanea: nao muda nada
                  }

                  if (!emSessao) {
                      String naFrente = d.rodando.contains(d.frente) ? d.frente : null;
                      if (naFrente != null && naFrente.equals(candidato)) vistoNaFrente++;
                      else { candidato = naFrente; vistoNaFrente = naFrente != null ? 1 : 0; }
                      if (vistoNaFrente >= 2) {
                          iniciarSessao(candidato);
                      } else {
                          atualizar(String.format(Locale.US, "Vigiando %d jogo(s) | %s", jogos.size(), linha(leitura)));
                          checarAtualizacao(agora, p);
                      }
                      return;
                  }

                  // ---- em partida
                  if (jogoAtual == null && !d.rodando.isEmpty()) jogoAtual = d.rodando.iterator().next();
                  boolean vivo = jogoAtual != null && d.rodando.contains(jogoAtual);
                  boolean naFrente = vivo && jogoAtual.equals(d.frente);

                  if (vivo) semProcessoDesde = 0;
                  else if (semProcessoDesde == 0) semProcessoDesde = agora;
                  if (naFrente || !vivo) noFundoDesde = 0;
                  else if (noFundoDesde == 0) noFundoDesde = agora;

                  boolean emCarencia = agora < carenciaAte;
                  boolean fechou = !emCarencia && semProcessoDesde > 0 && agora - semProcessoDesde >= CONFIRMA_FECHADO_MS;
                  boolean abandonado = !emCarencia && noFundoDesde > 0 && agora - noFundoDesde >= FUNDO_MAX_MS;
                  if (fechou || abandonado) {
                      encerrarSessao(fechou ? "jogo fechado" : "jogo ficou em segundo plano por 3 min");
                      return;
                  }

                  if (vivo && naFrente && leitura != null) {
                      if (leitura.bateria > picoBat) picoBat = leitura.bateria;
                      if (leitura.cpu > picoCpu) picoCpu = leitura.cpu;
                      checarCalor(leitura, p);
                  }

                  String nome = Jogo.nome(this, jogoAtual);
                  String txt = linha(leitura);
                  if (!vivo) {
                      long faltam = Math.max(0L, (CONFIRMA_FECHADO_MS - (agora - semProcessoDesde)) / 1000L);
                      atualizar(nome + ": nao encontrado, confirmando em " + faltam + " s");
                      removerSelo();
                  } else if (!naFrente) {
                      atualizar(nome + " em segundo plano (perfil mantido)");
                      removerSelo();
                  } else {
                      long min = (agora - inicio) / 60000L;
                      atualizar(nome + " | " + txt + (forte ? " | perfil FORTE" : " | perfil Leve") + " | " + min + " min");
                      if (p.getBoolean("selo", true)) mostrarSelo(txt + "  " + min + "min" + (forte ? "  ❄❄" : "  ❄"), leitura);
                  }
              }

              private void iniciarSessao(String pkg) {
                  emSessao = true;
                  jogoAtual = pkg;
                  candidato = null;
                  vistoNaFrente = 0;
                  forte = false;
                  quentes = 0;
                  semProcessoDesde = 0;
                  noFundoDesde = 0;
                  inicio = System.currentTimeMillis();
                  picoBat = 0f;
                  picoCpu = 0f;
                  Jogo.prefs(this).edit().putString("sessao_jogo", pkg).putLong("sessao_inicio", inicio).apply();
                  String r = Jogo.executarTudo(Jogo.planoSessao(this, pkg, false));
                  carenciaAte = System.currentTimeMillis() + CARENCIA_MS;
                  Jogo.prefs(this).edit().putString("ult_log", r).apply();
                  alerta("sessao", 2, "Modo Jogo ativado", Jogo.nome(this, pkg) + " aberto. Perfil Leve aplicado:\n" + r, false);
              }

              private void checarCalor(Termica.Leitura l, SharedPreferences p) {
                  int limite = p.getInt("limite_bat", 41);
                  boolean quente = (l.bateria >= limite) || (l.status >= 3) || (l.cpu >= 90f);
                  if (quente) quentes++; else quentes = 0;
                  if (quentes >= 3 && !forte && p.getBoolean("protecao", true)) {
                      forte = true;
                      List<Plano.Item> itens = new ArrayList<Plano.Item>();
                      for (Plano.Item it : Jogo.planoSessao(this, jogoAtual, true)) if (!"matar".equals(it.id)) itens.add(it);
                      String r = Jogo.executarTudo(itens);
                      carenciaAte = System.currentTimeMillis() + CARENCIA_MS;
                      alerta("alerta", 4, "Esquentou: perfil FORTE", String.format(Locale.US,
                              "Bateria %.1f°C%s. Cortei FPS e brilho para esfriar (sem reiniciar o jogo):\n%s\nDica: tire a capinha e nao jogue carregando.",
                              l.bateria, l.carregando ? " (CARREGANDO)" : "", r), true);
                  }
              }

              private void encerrarSessao(String motivo) {
                  String r = Mudancas.restaurar(this, Mudancas.SESSAO);
                  long min = (System.currentTimeMillis() - inicio) / 60000L;
                  String nome = Jogo.nome(this, jogoAtual);
                  SharedPreferences p = Jogo.prefs(this);
                  String hist = p.getString("historico", "");
                  String linhaHist = String.format(Locale.US, "%tF %<tR  %s  %d min  bat %.1f°%s%s",
                          System.currentTimeMillis(), nome, min, picoBat,
                          picoCpu > 0 ? String.format(Locale.US, "  cpu %.0f°", picoCpu) : "", forte ? "  [Forte]" : "");
                  String[] partes = hist.isEmpty() ? new String[0] : hist.split("\n");
                  StringBuilder nh = new StringBuilder(linhaHist);
                  for (int i = 0; i < partes.length && i < 14; i++) nh.append('\n').append(partes[i]);
                  p.edit()
                          .putString("ult_jogo", nome)
                          .putLong("ult_min", min)
                          .putFloat("ult_bat", picoBat)
                          .putFloat("ult_cpu", picoCpu)
                          .putBoolean("ult_forte", forte)
                          .putLong("ult_quando", System.currentTimeMillis())
                          .putString("historico", nh.toString())
                          .remove("sessao_jogo")
                          .apply();
                  emSessao = false;
                  removerSelo();
                  alerta("sessao", 2, "Partida encerrada: tudo restaurado", String.format(Locale.US,
                          "%s (%s): %d min, pico bateria %.1f°C%s%s.\n%s", nome, motivo, min, picoBat,
                          picoCpu > 0 ? String.format(Locale.US, ", CPU %.0f°C", picoCpu) : "",
                          forte ? ", precisou do perfil FORTE" : "", r), false);
                  jogoAtual = null;
                  forte = false;
                  candidato = null;
                  vistoNaFrente = 0;
                  semProcessoDesde = 0;
                  noFundoDesde = 0;
              }

              /** Fora de partida, de tempos em tempos, procura atualizacao no GitHub (e instala se o usuario permitiu). */
              private void checarAtualizacao(long agora, SharedPreferences p) {
                  if (agora < proximaChecagemUpdate) return;
                  proximaChecagemUpdate = agora + 6L * 3600000L;
                  if (!p.getBoolean("auto_update", true)) return;
                  Atualizador.Release r = Atualizador.buscar();
                  if (r == null || !r.nova()) return;
                  if (Vigia.emSessao) return;
                  Atualizador.instalar(this, r, null);
              }

              // ------------------------------------------------------------------ selo sobre o jogo
              private void mostrarSelo(final String txt, final Termica.Leitura l) {
                  if (!Settings.canDrawOverlays(this)) return;
                  final int cor = l.cpu > 0 ? Ui.corCpu(l.cpu) : Ui.corBat(l.bateria);
                  h.post(new Runnable() {
                      public void run() {
                          try {
                              if (selo == null) {
                                  selo = new TextView(Vigia.this);
                                  selo.setTextSize(11);
                                  selo.setTextColor(0xFFFFFFFF);
                                  int p = Ui.dp(Vigia.this, 6);
                                  selo.setPadding(p * 2, p, p * 2, p);
                                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                                          WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                                          PixelFormat.TRANSLUCENT);
                                  lp.gravity = Gravity.TOP | Gravity.START;
                                  lp.x = Ui.dp(Vigia.this, 8);
                                  lp.y = Ui.dp(Vigia.this, 36);
                                  wm.addView(selo, lp);
                              }
                              selo.setText(txt);
                              selo.setBackground(Ui.fundo(Vigia.this, 0xCC0A0F0A, 14, cor));
                          } catch (Throwable t) {
                              selo = null;
                          }
                      }
                  });
              }

              private void removerSelo() {
                  h.post(new Runnable() {
                      public void run() {
                          if (selo != null) {
                              try { wm.removeView(selo); } catch (Throwable t) { }
                              selo = null;
                          }
                      }
                  });
              }

              @Override
              public void onDestroy() {
                  ativo = false;
                  estado = "parado";
                  if (ex != null) ex.shutdownNow();
                  removerSelo();
                  if (emSessao) {
                      emSessao = false;
                      final Context c = getApplicationContext();
                      new Thread(new Runnable() {
                          public void run() { Mudancas.restaurar(c, Mudancas.SESSAO); }
                      }).start();
                  }
                  super.onDestroy();
              }
          }
