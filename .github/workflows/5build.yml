              static int corBat(float t) {
                  if (t < 0f) return CINZA;
                  if (t < 38f) return VERDE;
                  if (t < 41f) return AMARELO;
                  if (t < 44f) return LARANJA;
                  return VERMELHO;
              }

              /** Cor para temperatura de CPU/GPU. */
              static int corCpu(float t) {
                  if (t < 0f) return CINZA;
                  if (t < 60f) return VERDE;
                  if (t < 75f) return AMARELO;
                  if (t < 85f) return LARANJA;
                  return VERMELHO;
              }
          }
