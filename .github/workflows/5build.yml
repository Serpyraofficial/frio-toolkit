          package br.toolkit.frio;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.view.View;

          import java.util.ArrayList;
          import java.util.List;

          /** Grafico simples de temperatura (bateria e CPU) desenhado na mao. */
          final class Grafico extends View {
              private final List<float[]> series = new ArrayList<float[]>();
              private final List<Integer> cores = new ArrayList<Integer>();
              private final Paint linha = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint grade = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint txt = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final float min = 20f;
              private final float max = 100f;

              Grafico(Context c) {
                  super(c);
                  linha.setStyle(Paint.Style.STROKE);
                  linha.setStrokeWidth(Ui.dp(c, 2.5f));
                  linha.setStrokeJoin(Paint.Join.ROUND);
                  grade.setColor(0x33FFFFFF);
                  grade.setStrokeWidth(Ui.dp(c, 1));
                  txt.setColor(0x99FFFFFF);
                  txt.setTextSize(Ui.dp(c, 11));
                  setBackground(Ui.fundo(c, Ui.CARD2, 14, Ui.BORDA));
              }

              void definir(List<float[]> s, List<Integer> c) {
                  series.clear();
                  series.addAll(s);
                  cores.clear();
                  cores.addAll(c);
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas c) {
                  super.onDraw(c);
                  float w = getWidth();
                  float h = getHeight();
                  float pad = Ui.dp(getContext(), 8);
                  float[] refs = { 40f, 60f, 80f };
                  for (float r : refs) {
                      float y = y(r, h, pad);
                      c.drawLine(pad, y, w - pad, y, grade);
                      c.drawText((int) r + "°", pad + 4, y - 4, txt);
                  }
                  for (int s = 0; s < series.size(); s++) {
                      float[] d = series.get(s);
                      if (d.length < 2) continue;
                      linha.setColor(cores.get(s));
                      Path p = new Path();
                      boolean inicio = true;
                      for (int i = 0; i < d.length; i++) {
                          if (d[i] <= 0f) { inicio = true; continue; }
                          float x = pad + (w - 2 * pad) * i / (float) (d.length - 1);
                          float y = y(d[i], h, pad);
                          if (inicio) { p.moveTo(x, y); inicio = false; } else p.lineTo(x, y);
                      }
                      c.drawPath(p, linha);
                  }
              }

              private float y(float v, float h, float pad) {
                  float k = (Math.max(min, Math.min(max, v)) - min) / (max - min);
                  return h - pad - k * (h - 2 * pad);
              }
          }
