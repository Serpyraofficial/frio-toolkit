          package br.toolkit.frio;

          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.os.BatteryManager;
          import android.os.PowerManager;

          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** Temperaturas reais: bateria (sem permissao) + CPU/GPU/corpo pelo sensor do sistema (via Shizuku). */
          final class Termica {
              private Termica() { }

              static final class Leitura {
                  float bateria = -1f, cpu = -1f, gpu = -1f, pele = -1f;
                  int status = -1;
                  float limite = Float.NaN;
                  boolean carregando;
                  int nivel = -1;
                  String fonte = "bateria";
              }

              private static final Pattern TEMP = Pattern.compile(
                      "Temperature\\{mValue=(-?[0-9.]+), mType=(-?\\d+), mName=([^,]+), mStatus=(-?\\d+)\\}");

              static Leitura ler(Context c, boolean usarShell) {
                  Leitura l = new Leitura();
                  Intent b = c.registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                  if (b != null) {
                      int t = b.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0);
                      if (t > 0) l.bateria = t / 10f;
                      l.carregando = b.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0) != 0;
                      int nv = b.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                      int es = b.getIntExtra(BatteryManager.EXTRA_SCALE, 100);
                      if (nv >= 0 && es > 0) l.nivel = nv * 100 / es;
                  }
                  PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      l.status = pm.getCurrentThermalStatus();
                      try { l.limite = pm.getThermalHeadroom(10); } catch (Throwable t) { }
                  }
                  if (usarShell) lerSensores(l);
                  return l;
              }

              private static void lerSensores(Leitura l) {
                  String out = Sh.run("dumpsys thermalservice");
                  int i = out.indexOf("Current temperatures from HAL");
                  boolean achou = processar(i >= 0 ? out.substring(i) : out, l);
                  if (!achou && i >= 0) achou = processar(out, l);
                  if (achou) { l.fonte = "sensores do sistema"; return; }
                  // plano B: zonas termicas do kernel
                  String z = Sh.run("for z in /sys/class/thermal/thermal_zone*; do echo \"$(cat $z/type 2>/dev/null) $(cat $z/temp 2>/dev/null)\"; done");
                  for (String linha : z.split("\n")) {
                      String[] p = linha.trim().split("\\s+");
                      if (p.length < 2) continue;
                      float v;
                      try { v = Float.parseFloat(p[1]); } catch (NumberFormatException e) { continue; }
                      if (v > 1000f) v = v / 1000f;
                      if (v <= 0f || v >= 150f) continue;
                      String n = p[0].toLowerCase();
                      if (n.contains("gpu")) l.gpu = Math.max(l.gpu, v);
                      else if (n.contains("cpu") || n.contains("tsens") || n.contains("cluster") || n.contains("soc")) l.cpu = Math.max(l.cpu, v);
                      else if (n.contains("skin") || n.contains("xo_therm") || n.contains("quiet") || n.contains("back") || n.contains("case")) l.pele = Math.max(l.pele, v);
                      else continue;
                      l.fonte = "zonas termicas";
                  }
              }

              private static boolean processar(String txt, Leitura l) {
                  Matcher m = TEMP.matcher(txt);
                  boolean achou = false;
                  while (m.find()) {
                      float v;
                      int tipo;
                      try { v = Float.parseFloat(m.group(1)); tipo = Integer.parseInt(m.group(2)); } catch (NumberFormatException e) { continue; }
                      if (v <= 0f || v >= 150f) continue;
                      if (tipo == 0) { l.cpu = Math.max(l.cpu, v); achou = true; }
                      else if (tipo == 1) { l.gpu = Math.max(l.gpu, v); achou = true; }
                      else if (tipo == 3) { l.pele = Math.max(l.pele, v); achou = true; }
                  }
                  return achou;
              }

              static String nomeStatus(int s) {
                  switch (s) {
                      case 0: return "normal";
                      case 1: return "leve";
                      case 2: return "moderado";
                      case 3: return "SEVERO (o sistema ja reduz o desempenho)";
                      case 4: return "CRITICO";
                      case 5: return "EMERGENCIA";
                      case 6: return "DESLIGANDO";
                      default: return "indisponivel";
                  }
              }

              static String fmt(float v) {
                  return v < 0f ? "--" : String.format(java.util.Locale.US, "%.1f°", v);
              }

              /** Maior frequencia atual entre os nucleos, em MHz (via Shizuku). */
              static int freqMaxMHz() {
                  String out = Sh.run("cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_cur_freq 2>/dev/null");
                  int max = 0;
                  for (String s : out.split("\n")) {
                      int v = Sh.inteiro(s, 0);
                      if (v > max) max = v;
                  }
                  return max / 1000;
              }

              /** Processos que mais usam CPU agora. */
              static String topProcessos() {
                  String out = Sh.run("top -b -n 2 -d 1 -m 8");
                  int i = out.lastIndexOf("PID");
                  if (i < 0) return out;
                  String[] ls = out.substring(i).split("\n");
                  StringBuilder sb = new StringBuilder();
                  for (int k = 0; k < ls.length && k < 9; k++) {
                      String s = ls[k].trim().replaceAll("\\s+", " ");
                      if (s.length() > 70) s = s.substring(0, 70);
                      sb.append(s).append('\n');
                  }
                  return sb.toString().trim();
              }
          }
