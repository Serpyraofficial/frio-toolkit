          package br.toolkit.frio;

          import android.app.usage.StorageStats;
          import android.app.usage.StorageStatsManager;
          import android.app.usage.UsageStats;
          import android.app.usage.UsageStatsManager;
          import android.content.Context;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.os.Environment;
          import android.os.StatFs;
          import android.os.storage.StorageManager;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          /** Limpeza: so cache e lixo. Nunca toca em contas, saves, fotos ou conversas sem voce escolher. */
          final class Limpeza {
              private Limpeza() { }

              static final String SD = "/storage/emulated/0";

              static final class Arq {
                  final String nome;
                  final long bytes;
                  final String extra;

                  Arq(String nome, long bytes, String extra) {
                      this.nome = nome;
                      this.bytes = bytes;
                      this.extra = extra;
                  }
              }

              static String tam(long b) {
                  double v = b;
                  if (v >= 1073741824.0) return String.format(Locale.US, "%.1f GB", v / 1073741824.0);
                  if (v >= 1048576.0) return String.format(Locale.US, "%.0f MB", v / 1048576.0);
                  return String.format(Locale.US, "%.0f KB", v / 1024.0);
              }

              static long[] espaco() {
                  StatFs sf = new StatFs(Environment.getDataDirectory().getPath());
                  return new long[] { sf.getAvailableBytes(), sf.getTotalBytes() };
              }

              /** Le a saida do "du -k" (kb<TAB>caminho). */
              static List<Arq> du(String cmd) {
                  List<Arq> l = new ArrayList<Arq>();
                  for (String linha : Sh.run(cmd).split("\n")) {
                      String s = linha.trim();
                      int t = s.indexOf('\t');
                      if (t < 0) t = s.indexOf(' ');
                      if (t <= 0) continue;
                      try {
                          long kb = Long.parseLong(s.substring(0, t).trim());
                          l.add(new Arq(s.substring(t + 1).trim(), kb * 1024L, null));
                      } catch (NumberFormatException e) { }
                  }
                  return l;
              }

              static long soma(List<Arq> l) {
                  long s = 0;
                  for (Arq a : l) s += a.bytes;
                  return s;
              }

              static void ordenar(List<Arq> l) {
                  Collections.sort(l, new Comparator<Arq>() {
                      public int compare(Arq a, Arq b) { return Long.compare(b.bytes, a.bytes); }
                  });
              }

              static List<Arq> cachesExternos() { return du("du -sk " + SD + "/Android/data/*/cache 2>/dev/null"); }

              static List<Arq> miniaturas() { return du("du -sk " + SD + "/DCIM/.thumbnails " + SD + "/Pictures/.thumbnails 2>/dev/null"); }

              static List<Arq> lixeira() {
                  return du("find " + SD + " -path " + SD + "/Android -prune -o -type f -name '.trashed-*' -exec du -k {} + 2>/dev/null");
              }

              static List<Arq> apks() {
                  return du("find " + SD + "/Download " + SD + "/Downloads -maxdepth 3 -type f -iname '*.apk' -exec du -k {} + 2>/dev/null");
              }

              static List<Arq> grandes(long minBytes) {
                  List<Arq> l = du("find " + SD + " -path " + SD + "/Android -prune -o -type f -size +" + minBytes + "c -exec du -k {} + 2>/dev/null");
                  ordenar(l);
                  return l;
              }

              /** Cache interno de todos os apps (precisa do "acesso ao uso", que o app libera sozinho pelo Shizuku). */
              static long cacheApps(Context c, List<Arq> top) {
                  StorageStatsManager ssm = (StorageStatsManager) c.getSystemService(Context.STORAGE_STATS_SERVICE);
                  PackageManager pm = c.getPackageManager();
                  long total = 0;
                  for (ApplicationInfo ai : pm.getInstalledApplications(0)) {
                      try {
                          StorageStats st = ssm.queryStatsForPackage(StorageManager.UUID_DEFAULT, ai.packageName, android.os.Process.myUserHandle());
                          long cb = st.getCacheBytes();
                          total += cb;
                          if (top != null && cb > 1048576L) top.add(new Arq(String.valueOf(pm.getApplicationLabel(ai)), cb, ai.packageName));
                      } catch (Exception e) { }
                  }
                  if (top != null) ordenar(top);
                  return total;
              }

              /** Apps instalados por voce que nao sao abertos ha X dias. */
              static List<Arq> naoUsados(Context c, int dias) {
                  List<Arq> r = new ArrayList<Arq>();
                  UsageStatsManager usm = (UsageStatsManager) c.getSystemService(Context.USAGE_STATS_SERVICE);
                  StorageStatsManager ssm = (StorageStatsManager) c.getSystemService(Context.STORAGE_STATS_SERVICE);
                  PackageManager pm = c.getPackageManager();
                  long agora = System.currentTimeMillis();
                  long corte = agora - dias * 86400000L;
                  Map<String, Long> ult = new HashMap<String, Long>();
                  List<UsageStats> us = usm.queryUsageStats(UsageStatsManager.INTERVAL_BEST, agora - 400L * 86400000L, agora);
                  if (us != null) {
                      for (UsageStats s : us) {
                          Long v = ult.get(s.getPackageName());
                          if (v == null || s.getLastTimeUsed() > v) ult.put(s.getPackageName(), s.getLastTimeUsed());
                      }
                  }
                  for (ApplicationInfo ai : pm.getInstalledApplications(0)) {
                      if ((ai.flags & ApplicationInfo.FLAG_SYSTEM) != 0) continue;
                      String pk = ai.packageName;
                      if (pk.equals(c.getPackageName()) || pk.equals("moe.shizuku.privileged.api")) continue;
                      if (pm.getLaunchIntentForPackage(pk) == null) continue;
                      try {
                          long inst = pm.getPackageInfo(pk, 0).firstInstallTime;
                          if (inst > corte) continue;
                          Long lu = ult.get(pk);
                          long uso = lu == null ? 0L : lu;
                          if (uso > corte) continue;
                          StorageStats st = ssm.queryStatsForPackage(StorageManager.UUID_DEFAULT, pk, android.os.Process.myUserHandle());
                          long bytes = st.getAppBytes() + st.getDataBytes();
                          String quando = uso <= 0 ? "sem uso registrado" : "ultimo uso ha " + ((agora - uso) / 86400000L) + " dias";
                          r.add(new Arq(String.valueOf(pm.getApplicationLabel(ai)) + "  (" + quando + ")", bytes, pk));
                      } catch (Exception e) { }
                  }
                  ordenar(r);
                  return r;
              }

              static String apagar(List<Arq> l) {
                  int ok = 0;
                  long b = 0;
                  for (Arq a : l) {
                      String r = Sh.run("rm -rf -- " + Sh.q(a.nome));
                      if (!r.toLowerCase().contains("denied") && !r.startsWith("erro")) { ok++; b += a.bytes; }
                  }
                  return ok + " item(ns) apagado(s), ~" + tam(b);
              }

              /** Limpa o cache de UM app (Android 14+: comando oficial; antes disso: cache externo). */
              static String limparCacheApp(String pkg) {
                  String r = Sh.run("pm clear --cache-only " + pkg);
                  if (r.toLowerCase().contains("success")) return "Cache de " + pkg + " limpo.";
                  Sh.run("rm -rf " + SD + "/Android/data/" + pkg + "/cache/*");
                  Sh.run("pm trim-caches 999999999999");
                  return "Cache externo de " + pkg + " limpo (o cache interno foi liberado junto com o de todos os apps).";
              }
          }
