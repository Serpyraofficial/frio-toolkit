          package br.toolkit.frio;

          import android.content.pm.PackageManager;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.lang.reflect.Method;
          import java.util.concurrent.TimeUnit;

          import rikka.shizuku.Shizuku;

          /** Executa comandos com a permissao do Shizuku (nivel ADB, sem root). */
          final class Sh {
              private Sh() { }

              private static Method metodo;

              static boolean rodando() {
                  try { return Shizuku.pingBinder(); } catch (Throwable t) { return false; }
              }

              static boolean pronto() {
                  try {
                      return Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              static void pedirPermissao() {
                  try { Shizuku.requestPermission(100); } catch (Throwable t) { }
              }

              /** Roda o comando no shell e devolve stdout+stderr juntos. */
              static String run(String cmd) {
                  if (!pronto()) return "erro: Shizuku nao conectado";
                  try {
                      // newProcess e privado nas versoes novas da API; reflexao e o jeito usado pelos apps.
                      Process p = processo("( " + cmd + " ) 2>&1");
                      try { p.getOutputStream().close(); } catch (Throwable t) { }
                      StringBuilder sb = new StringBuilder();
                      BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      String l;
                      while ((l = r.readLine()) != null) sb.append(l).append('\n');
                      p.waitFor(60, TimeUnit.SECONDS);
                      return sb.toString().trim();
                  } catch (Throwable t) {
                      return "erro: " + t;
                  }
              }

              private static Process processo(String cmd) throws Exception {
                  synchronized (Sh.class) {
                      if (metodo == null) {
                          metodo = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                          metodo.setAccessible(true);
                      }
                  }
                  return (Process) metodo.invoke(null, new String[] { "sh", "-c", cmd }, null, null);
              }

              /** Copia um arquivo do app para um caminho do shell (ex.: /data/local/tmp), enviando os bytes pelo "cat". */
              static String enviarArquivo(java.io.File origem, String destino) {
                  if (!pronto()) return "erro: Shizuku nao conectado";
                  try {
                      Process p = processo("cat > " + q(destino) + " && echo OK_COPIA 2>&1");
                      java.io.OutputStream os = p.getOutputStream();
                      java.io.FileInputStream in = new java.io.FileInputStream(origem);
                      byte[] buf = new byte[65536];
                      int n;
                      while ((n = in.read(buf)) > 0) os.write(buf, 0, n);
                      in.close();
                      os.flush();
                      os.close();
                      StringBuilder sb = new StringBuilder();
                      BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      String l;
                      while ((l = r.readLine()) != null) sb.append(l).append('\n');
                      p.waitFor(120, TimeUnit.SECONDS);
                      return sb.toString().trim();
                  } catch (Throwable t) {
                      return "erro: " + t;
                  }
              }

              /** Grava um texto num arquivo do shell. */
              static String escreverTexto(String texto, String destino) {
                  if (!pronto()) return "erro: Shizuku nao conectado";
                  try {
                      java.io.File tmp = java.io.File.createTempFile("frio", ".txt");
                      java.io.FileOutputStream o = new java.io.FileOutputStream(tmp);
                      o.write(texto.getBytes("UTF-8"));
                      o.close();
                      String r = enviarArquivo(tmp, destino);
                      tmp.delete();
                      return r;
                  } catch (Throwable t) {
                      return "erro: " + t;
                  }
              }

              /** Aspas simples seguras para o shell. */
              static String q(String s) {
                  return "'" + s.replace("'", "'\\''") + "'";
              }

              static int inteiro(String s, int padrao) {
                  try { return (int) Math.round(Double.parseDouble(s.trim())); } catch (Exception e) { return padrao; }
              }
          }
