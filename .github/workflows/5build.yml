          echo "Projeto criado: $(find . -type f | wc -l) arquivos"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-disabled: true
      - name: Compilar
        working-directory: FrioToolkit
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Conferir a versao do APK
        run: |
          APK=FrioToolkit/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | head -1
            "$AAPT" dump badging "$APK" | grep -q "versionCode='${{ github.run_number }}'" || { echo "versionCode errado no APK"; exit 1; }
          else
            echo "aapt nao encontrado; pulando a conferencia"
          fi
          cp $APK FrioToolkit-${{ github.run_number }}.apk
      - name: Publicar o APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Frio Toolkit 2.${{ github.run_number }}
          make_latest: true
          body: |
            Frio Toolkit 2.${{ github.run_number }}  > Feito por Carlos Lima
            - CORRIGIDO: a atualizacao agora instala DE VERDADE. Antes o Android fechava o app no meio e a instalacao era abortada; agora um instalador independente termina o servico, grava o resultado e REABRE o app ja atualizado.
            - O app confere o APK antes (pacote, versao e assinatura) e, ao reabrir, confirma que a versao mudou. Se falhar, mostra o motivo exato e oferece o instalador do Android.
            - BOOST: desempenho estavel (sem picos de calor), animacoes desligadas durante o jogo, Nao perturbe e modo TURBO (Game Mode desempenho), tudo restaurado ao fechar o jogo.
            - Credito na tela inicial: > Feito por Carlos Lima
          files: FrioToolkit-${{ github.run_number }}.apk
