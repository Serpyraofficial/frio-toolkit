              private void abrirJogo() {
                  String pkg = Jogo.jogos(this).get(0);
                  Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
                  if (i == null) { aviso(Jogo.nome(this, pkg) + " nao esta instalado."); return; }
                  if (!Vigia.ativo && Sh.pronto()) ligarVigia();
                  abrir(i);
              }

              private void escolherJogos() {
                  PackageManager pm = getPackageManager();
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(Intent.CATEGORY_LAUNCHER);
                  final List<String[]> apps = new ArrayList<String[]>();
                  Set<String> vistos = new HashSet<String>();
                  for (ResolveInfo r : pm.queryIntentActivities(i, 0)) {
                      String pk = r.activityInfo.packageName;
                      if (pk.equals(getPackageName()) || !vistos.add(pk)) continue;
                      apps.add(new String[] { String.valueOf(r.loadLabel(pm)), pk });
                  }
                  Collections.sort(apps, new Comparator<String[]>() {
                      public int compare(String[] a, String[] b) { return a[0].compareToIgnoreCase(b[0]); }
                  });
                  final Set<String> sel = new HashSet<String>(Jogo.jogos(this));
                  CharSequence[] nomes = new CharSequence[apps.size()];
                  boolean[] marc = new boolean[apps.size()];
                  for (int k = 0; k < apps.size(); k++) {
                      nomes[k] = apps.get(k)[0];
                      marc[k] = sel.contains(apps.get(k)[1]);
                  }
                  new AlertDialog.Builder(this, DIALOGO).setTitle("Quais jogos vigiar?")
                          .setMultiChoiceItems(nomes, marc, (d, w, on) -> {
                              if (on) sel.add(apps.get(w)[1]); else sel.remove(apps.get(w)[1]);
                          })
                          .setPositiveButton("Salvar", (d, w) -> {
                              prefs.edit().putStringSet("jogos", new HashSet<String>(sel)).apply();
                              mostrar("jogo");
                          })
                          .setNegativeButton("Cancelar", null).show();
              }

