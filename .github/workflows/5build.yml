                                  }
                              }));
                  }
                  return l;
              }

              /** Executa um plano inteiro (usado pelo Vigia, sem dialogo). */
              static String executarTudo(List<Plano.Item> itens) {
                  StringBuilder sb = new StringBuilder();
                  for (Plano.Item it : itens) {
                      String r;
                      try { r = it.acao.executar(); } catch (Exception e) { r = "erro: " + e.getMessage(); }
                      sb.append("✔ ").append(it.titulo);
                      if (r != null && !r.trim().isEmpty()) sb.append(": ").append(r.trim());
                      sb.append('\n');
                  }
                  return sb.toString().trim();
