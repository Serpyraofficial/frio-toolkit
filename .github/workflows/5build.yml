              private void escolherArquivos(String titulo, String intro, List<Limpeza.Arq> l, boolean apps) {
                  if (l.isEmpty()) { log("Nada encontrado. ✔"); aviso("Nada encontrado."); return; }
                  List<Plano.Item> itens = new ArrayList<Plano.Item>();
                  for (final Limpeza.Arq a : l) {
                      Plano.Acao acao;
                      String nome;
                      if (apps) {
                          nome = a.nome;
                          acao = () -> Sh.run("pm uninstall " + a.extra);
                      } else {
                          nome = a.nome.replace(Limpeza.SD + "/", "");
                          acao = () -> Limpeza.apagar(Collections.singletonList(a));
                      }
                      itens.add(new Plano.Item("x", nome, Limpeza.tam(a.bytes) + (apps ? "  •  " + a.extra : ""), false, acao));
                  }
                  mostrarPlano(titulo, intro, itens, null);
              }

              private void cacheJogo() {
                  preparar("Cache do jogo", "Limpa so o cache. Conta, configuracoes e progresso ficam.", () -> {
                      List<Plano.Item> l = new ArrayList<Plano.Item>();
                      for (final String pkg : Jogo.jogos(this)) {
                          l.add(new Plano.Item("j", "Cache do " + Jogo.nome(this, pkg), pkg, true, () -> Limpeza.limparCacheApp(pkg)));
                      }
                      return l;
                  });
              }

