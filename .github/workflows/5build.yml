              private static final Pattern FRENTE = Pattern.compile("(?:topResumedActivity|mResumedActivity|mFocusedApp)[^\\n]*?\\s([a-zA-Z0-9_.]+)/");

              /** Uma unica chamada ao shell: quais jogos tem processo vivo + qual app esta na frente. */
              static Deteccao detectar(List<String> jogos) {
                  Deteccao d = new Deteccao();
                  if (!Sh.pronto()) return d;
                  StringBuilder cmd = new StringBuilder("for p in");
                  for (String j : jogos) cmd.append(' ').append(j);
                  cmd.append("; do pidof $p >/dev/null 2>&1 && echo \"RUN $p\"; done; ");
                  cmd.append("dumpsys activity activities 2>/dev/null | grep -m 2 -E 'topResumedActivity|mResumedActivity|mFocusedApp'; echo FIM_OK");
                  String out = Sh.run(cmd.toString());
                  if (!out.contains("FIM_OK")) return d;
                  d.ok = true;
                  for (String l : out.split("\n")) {
                      String s = l.trim();
                      if (s.startsWith("RUN ")) {
                          String pk = s.substring(4).trim();
                          if (jogos.contains(pk)) d.rodando.add(pk);
                      } else if (d.frente.isEmpty()) {
                          Matcher m = FRENTE.matcher(s);
                          if (m.find()) d.frente = m.group(1);
                      }
                  }
                  return d;
