          package br.toolkit.frio;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          /**
           * Registro de TUDO que o app muda no sistema, com o comando para desfazer.
           * Equivale ao "Desfazer" do PC-Toolkit: guarda o valor original na primeira mudanca.
           * Escopo SESSAO = volta sozinho quando o jogo fecha. FIXO = so volta pelo "Desfazer".
           */
          final class Mudancas {
              private Mudancas() { }

              static final String SESSAO = "sessao";
              static final String FIXO = "fixo";

              private static SharedPreferences sp(Context c) {
                  return c.getSharedPreferences("mudancas", Context.MODE_PRIVATE);
              }

              static synchronized JSONArray lista(Context c) {
                  try { return new JSONArray(sp(c).getString("l", "[]")); } catch (JSONException e) { return new JSONArray(); }
              }

              private static void salvar(Context c, JSONArray a) {
                  sp(c).edit().putString("l", a.toString()).apply();
              }

              private static int indice(JSONArray a, String chave) {
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o != null && chave.equals(o.optString("chave"))) return i;
                  }
                  return -1;
              }

              static synchronized boolean registrado(Context c, String chave) {
                  return indice(lista(c), chave) >= 0;
              }

              static synchronized int contar(Context c, String escopo) {
                  JSONArray a = lista(c);
                  int n = 0;
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o != null && (escopo == null || escopo.equals(o.optString("escopo")))) n++;
                  }
                  return n;
              }

              /** Registra (so na primeira vez, preservando o original) e aplica o comando. */
              static synchronized String aplicar(Context c, String escopo, String chave, String desc, String cmdAplicar, String cmdRestaurar) {
                  JSONArray a = lista(c);
                  if (indice(a, chave) < 0) {
                      JSONObject o = new JSONObject();
                      try {
                          o.put("chave", chave);
                          o.put("escopo", escopo);
                          o.put("desc", desc);
                          o.put("restaurar", cmdRestaurar);
                          o.put("quando", System.currentTimeMillis());
                      } catch (JSONException e) { }
                      a.put(o);
                      salvar(c, a);
                  }
                  return Sh.run(cmdAplicar);
              }

              /** Muda um "settings" do Android guardando o valor original. */
              static String setting(Context c, String escopo, String ns, String key, String valor, String desc) {
                  String chave = "settings:" + ns + ":" + key;
                  String restaurar = "";
                  if (!registrado(c, chave)) {
                      String orig = Sh.run("settings get " + ns + " " + key).trim();
                      if (orig.isEmpty() || orig.equals("null") || orig.startsWith("erro")) restaurar = "settings delete " + ns + " " + key;
                      else restaurar = "settings put " + ns + " " + key + " " + Sh.q(orig);
                  }
                  return aplicar(c, escopo, chave, desc, "settings put " + ns + " " + key + " " + Sh.q(valor), restaurar);
              }

              /** Restaura todas as mudancas do escopo (null = todas), da mais nova para a mais antiga. */
              static synchronized String restaurar(Context c, String escopo) {
                  JSONArray a = lista(c);
                  StringBuilder log = new StringBuilder();
                  JSONArray manter = new JSONArray();
                  for (int i = a.length() - 1; i >= 0; i--) {
                      JSONObject o = a.optJSONObject(i);
                      if (o == null) continue;
                      if (escopo == null || escopo.equals(o.optString("escopo"))) {
                          String r = o.optString("restaurar");
                          if (!r.isEmpty()) Sh.run(r);
                          log.append("↩ ").append(o.optString("desc")).append('\n');
                      }
                  }
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o != null && escopo != null && !escopo.equals(o.optString("escopo"))) manter.put(o);
                  }
                  salvar(c, manter);
                  String s = log.toString().trim();
                  return s.isEmpty() ? "Nada para restaurar." : s;
              }

              /** Restaura uma mudanca especifica. */
              static synchronized String restaurarChave(Context c, String chave) {
                  JSONArray a = lista(c);
                  int i = indice(a, chave);
                  if (i < 0) return "Ja estava no padrao.";
                  JSONObject o = a.optJSONObject(i);
                  String r = o.optString("restaurar");
                  if (!r.isEmpty()) Sh.run(r);
                  JSONArray manter = new JSONArray();
                  for (int k = 0; k < a.length(); k++) if (k != i) manter.put(a.optJSONObject(k));
                  salvar(c, manter);
                  return "↩ " + o.optString("desc");
              }
          }
