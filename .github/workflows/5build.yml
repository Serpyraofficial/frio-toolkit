              private static String nomesCurtos(List<Limpeza.Arq> l, int max) {
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < l.size() && i < max; i++) {
                      String n = l.get(i).nome;
                      int k = n.lastIndexOf('/');
                      if (i > 0) sb.append(", ");
                      sb.append(k >= 0 ? n.substring(k + 1) : n);
                  }
                  if (l.size() > max) sb.append(" e mais ").append(l.size() - max);
                  return sb.toString();
              }

              private void analisar() {
                  if (!exigeShizuku()) return;
                  if (ocupado) { aviso("Aguarde a tarefa atual terminar."); return; }
                  ocupado = true;
                  log("🔍 Analisando (pode levar alguns segundos)...");
                  bg.execute(() -> {
                      try {
                          List<Limpeza.Arq> top = new ArrayList<Limpeza.Arq>();
                          long cache = Limpeza.cacheApps(this, top);
                          long ext = Limpeza.soma(Limpeza.cachesExternos());
                          long mini = Limpeza.soma(Limpeza.miniaturas());
                          List<Limpeza.Arq> lix = Limpeza.lixeira();
                          List<Limpeza.Arq> apk = Limpeza.apks();
                          StringBuilder sb = new StringBuilder();
                          sb.append("Cache dos apps: ").append(cache > 0 ? Limpeza.tam(cache) : "sem acesso (faca o passo 1 do Assistente)").append('\n');
                          for (int i = 0; i < top.size() && i < 8; i++) {
                              sb.append(String.format(Locale.US, "   %8s  %s%n", Limpeza.tam(top.get(i).bytes), top.get(i).nome));
                          }
                          sb.append("Cache externo dos apps: ").append(Limpeza.tam(ext)).append('\n');
                          sb.append("Miniaturas da galeria: ").append(Limpeza.tam(mini)).append('\n');
                          sb.append("Lixeira de fotos/videos: ").append(Limpeza.tam(Limpeza.soma(lix))).append(" (").append(lix.size()).append(" arquivos)\n");
                          sb.append("Instaladores APK esquecidos: ").append(Limpeza.tam(Limpeza.soma(apk))).append(" (").append(apk.size()).append(")\n");
                          long total = cache + ext + mini + Limpeza.soma(lix) + Limpeza.soma(apk);
                          sb.append("TOTAL que da para liberar: ~").append(Limpeza.tam(total)).append("\nNada foi apagado.\n");
                          log(sb.toString());
                      } finally {
                          ocupado = false;
                      }
                  });
              }

              private void limpeza(final boolean completa) {
                  preparar(completa ? "Limpeza completa" : "Limpeza rapida", "Marque o que quer limpar. Os tamanhos foram medidos agora.", () -> {
                      List<Plano.Item> l = new ArrayList<Plano.Item>();
                      long cache = Limpeza.cacheApps(this, null);
                      l.add(new Plano.Item("cache", "Cache de todos os apps" + (cache > 0 ? " (~" + Limpeza.tam(cache) + ")" : ""),
                              "Arquivos temporarios que os apps recriam sozinhos (pm trim-caches). Alguns apps podem demorar um pouco mais para abrir na primeira vez.",
                              true, () -> {
                                  long antes = Limpeza.espaco()[0];
                                  Sh.run("pm trim-caches 999999999999");
                                  Thread.sleep(1500);
                                  return "liberado ~" + Limpeza.tam(Math.max(0L, Limpeza.espaco()[0] - antes));
                              }));
                      long ext = Limpeza.soma(Limpeza.cachesExternos());
                      if (ext > 0) l.add(itemCmd("ext", "Cache externo dos apps (~" + Limpeza.tam(ext) + ")", "Pastas Android/data/<app>/cache.", true,
                              "rm -rf " + Limpeza.SD + "/Android/data/*/cache/*"));
                      long mini = Limpeza.soma(Limpeza.miniaturas());
                      if (mini > 0) l.add(itemCmd("mini", "Miniaturas da galeria (~" + Limpeza.tam(mini) + ")", "A galeria recria quando precisar.", true,
                              "rm -rf " + Limpeza.SD + "/DCIM/.thumbnails/* " + Limpeza.SD + "/Pictures/.thumbnails/*"));
                      if (completa) {
                          final List<Limpeza.Arq> lix = Limpeza.lixeira();
                          if (!lix.isEmpty()) l.add(new Plano.Item("lix", "Esvaziar a lixeira de fotos/videos (" + lix.size() + ", ~" + Limpeza.tam(Limpeza.soma(lix)) + ")",
                                  "Itens que voce JA apagou e o Android guarda por 30 dias. Depois disso nao da para recuperar.", false, () -> Limpeza.apagar(lix)));
                          final List<Limpeza.Arq> apk = Limpeza.apks();
                          if (!apk.isEmpty()) l.add(new Plano.Item("apk", "Instaladores APK na pasta Download (" + apk.size() + ", ~" + Limpeza.tam(Limpeza.soma(apk)) + ")",
                                  "Arquivos .apk que ja foram instalados: " + nomesCurtos(apk, 6), true, () -> Limpeza.apagar(apk)));
                          for (final String pkg : Jogo.jogos(this)) {
                              if (getPackageManager().getLaunchIntentForPackage(pkg) == null) continue;
                              l.add(new Plano.Item("jogo", "Cache do " + Jogo.nome(this, pkg), "So o cache: nao perde conta, configuracoes nem progresso.", true,
                                      () -> Limpeza.limparCacheApp(pkg)));
                          }
                      }
                      return l;
                  });
              }

              private void grandes() {
                  if (!exigeShizuku()) return;
                  log("Procurando arquivos grandes...");
                  bg.execute(() -> {
                      final List<Limpeza.Arq> l = Limpeza.grandes(100L * 1048576L);
                      runOnUiThread(() -> escolherArquivos("Arquivos grandes", "Marque o que quer APAGAR de vez (nao vai para a lixeira). O que ficar desmarcado continua no celular.", l, false));
                  });
              }

              private void naoUsados() {
                  if (!exigeShizuku()) return;
                  log("Procurando apps sem uso...");
                  bg.execute(() -> {
                      final List<Limpeza.Arq> l = Limpeza.naoUsados(this, 30);
                      runOnUiThread(() -> escolherArquivos("Apps sem uso ha 30 dias", "Marque para DESINSTALAR. Os dados desses apps serao apagados.", l, true));
                  });
