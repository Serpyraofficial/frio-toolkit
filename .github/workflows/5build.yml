              private static float[] arr(List<Float> l) {
                  float[] f = new float[l.size()];
                  for (int i = 0; i < f.length; i++) f[i] = l.get(i);
                  return f;
              }

              private void amostraTemp() {
                  if (lendo) return;
                  lendo = true;
                  leitor.execute(() -> {
                      final Termica.Leitura l = Termica.ler(this, Sh.pronto());
                      runOnUiThread(() -> {
                          lendo = false;
                          if (!"temp".equals(tela) || tBat == null || grafico == null) return;
                          medir(tBat, l.bateria, Ui.corBat(l.bateria));
                          medir(tCpu, l.cpu, Ui.corCpu(l.cpu));
                          medir(tGpu, l.gpu, Ui.corCpu(l.gpu));
                          medir(tPele, l.pele, Ui.corBat(l.pele));
                          histBat.add(l.bateria);
                          histCpu.add(l.cpu);
                          while (histBat.size() > 150) histBat.remove(0);
                          while (histCpu.size() > 150) histCpu.remove(0);
                          List<float[]> s = new ArrayList<float[]>();
                          s.add(arr(histBat));
                          s.add(arr(histCpu));
                          List<Integer> cs = new ArrayList<Integer>();
                          cs.add(Ui.VERDE);
                          cs.add(Ui.LARANJA);
                          grafico.definir(s, cs);
                          StringBuilder sb = new StringBuilder();
                          sb.append("Sistema termico: ").append(Termica.nomeStatus(l.status));
                          if (!Float.isNaN(l.limite) && l.limite > 0f) sb.append(String.format(Locale.US, "\nPerto do limite de throttling: %.0f%%", l.limite * 100f));
                          sb.append("\nFonte: ").append(l.fonte);
                          if (l.carregando) sb.append("\n⚡ Carregando: jogar carregando e a maior causa de esquentar.");
                          sb.append("\nReferencia: bateria ate 38° ok • 38-41° morno • 41-44° quente • 45°+ perigoso");
                          tInfo.setText(sb.toString());
                      });
                  });
              }

