              private void executar(final String titulo, final List<Plano.Item> sel, final Runnable depois) {
                  if (sel.isEmpty()) { aviso("Nada selecionado."); return; }
                  if (ocupado) { aviso("Aguarde a tarefa atual terminar."); return; }
                  ocupado = true;
                  log("▶ " + titulo);
                  bg.execute(() -> {
                      try {
                          for (Plano.Item it : sel) {
                              String r;
                              try { r = it.acao.executar(); } catch (Exception e) { r = "erro: " + e.getMessage(); }
                              if (r == null) r = "";
                              r = r.trim();
                              if (r.length() > 400) r = r.substring(0, 400) + "...";
                              log("  ✔ " + it.titulo + (r.isEmpty() ? "" : "\n     " + r.replace("\n", "\n     ")));
                          }
                          log("■ Concluido.\n");
                      } finally {
                          ocupado = false;
                      }
                      if (depois != null) runOnUiThread(depois);
                  });
              }

