                  if (!recuperou) {
                      recuperou = true;
                      if (!Vigia.ativo && !Vigia.emSessao && Mudancas.contar(this, Mudancas.SESSAO) > 0) {
                          log("Uma partida anterior nao terminou direito. Restaurei:\n" + Mudancas.restaurar(this, Mudancas.SESSAO));
                      }
                      if (prefs.getBoolean("vigia_auto", false) && !Vigia.ativo) {
