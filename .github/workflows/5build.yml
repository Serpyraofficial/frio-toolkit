          package br.toolkit.frio;

          import android.content.Context;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /**
           * Cacador de ameacas para celular: procura os recursos que trojans bancarios,
           * stalkerware e golpes usam no Android. Heuristico: mostra o motivo e voce decide.
           */
          final class Seguranca {
              private Seguranca() { }

              static final class Achado {
                  final int sev;          // 3 alto, 2 medio, 1 baixo, 0 info
                  final String titulo;
                  final String detalhe;
                  final String pkg;
                  final String tipo;      // acessibilidade, notificacao, admin, overlay, instalar, oculto, info
                  final String extra;

                  Achado(int sev, String titulo, String detalhe, String pkg, String tipo, String extra) {
                      this.sev = sev;
                      this.titulo = titulo;
                      this.detalhe = detalhe;
                      this.pkg = pkg;
                      this.tipo = tipo;
                      this.extra = extra;
                  }
              }

              private static final Pattern PKG = Pattern.compile("([a-zA-Z][a-zA-Z0-9_]*(\\.[a-zA-Z0-9_]+)+)");

              private static Set<String> pacotes(String txt) {
                  Set<String> s = new HashSet<String>();
                  Matcher m = PKG.matcher(txt);
                  while (m.find()) s.add(m.group(1));
                  return s;
              }

              static List<Achado> varrer(Context c) {
                  List<Achado> r = new ArrayList<Achado>();
                  PackageManager pm = c.getPackageManager();
                  Set<String> usuario = new HashSet<String>();
                  for (ApplicationInfo ai : pm.getInstalledApplications(0)) {
                      if ((ai.flags & ApplicationInfo.FLAG_SYSTEM) == 0) usuario.add(ai.packageName);
                  }
                  String eu = c.getPackageName();
                  Set<String> ignorar = new HashSet<String>();
                  ignorar.add(eu);
                  ignorar.add("moe.shizuku.privileged.api");

                  // 1) Acessibilidade
                  String acc = Sh.run("settings get secure enabled_accessibility_services").trim();
                  if (!acc.isEmpty() && !acc.equals("null") && !acc.startsWith("erro")) {
                      for (String comp : acc.split(":")) {
                          String pk = comp.split("/")[0].trim();
                          if (pk.isEmpty() || ignorar.contains(pk)) continue;
                          boolean us = usuario.contains(pk);
                          r.add(new Achado(us ? 2 : 0, "Acessibilidade ativa: " + Jogo.nome(c, pk),
                                  "Pode LER tudo o que aparece na tela e TOCAR sozinho. Apps legitimos usam (leitor de tela, automacao, gestos), "
                                          + "mas e o recurso numero 1 dos trojans bancarios no Android. Se voce nao reconhece ou nao lembra de ter ligado, desative.",
                                  pk, "acessibilidade", comp));
                      }
                  }

                  // 2) Leitores de notificacao
                  String nl = Sh.run("settings get secure enabled_notification_listeners").trim();
                  if (!nl.isEmpty() && !nl.equals("null") && !nl.startsWith("erro")) {
                      for (String comp : nl.split(":")) {
                          String pk = comp.split("/")[0].trim();
                          if (pk.isEmpty() || ignorar.contains(pk) || !usuario.contains(pk)) continue;
                          r.add(new Achado(1, "Le suas notificacoes: " + Jogo.nome(c, pk),
                                  "Ve todas as notificacoes, inclusive codigos de verificacao (SMS/WhatsApp) e mensagens. Normal em smartwatch e apps de automacao; suspeito se voce nao sabe o motivo.",
                                  pk, "notificacao", comp));
                      }
                  }

                  // 3) Administradores do dispositivo
                  Matcher m = Pattern.compile("admin=ComponentInfo\\{([^/}]+)/").matcher(Sh.run("dumpsys device_policy"));
                  Set<String> admins = new HashSet<String>();
                  while (m.find()) admins.add(m.group(1));
                  for (String pk : admins) {
                      if (ignorar.contains(pk)) continue;
                      boolean us = usuario.contains(pk);
                      r.add(new Achado(us ? 2 : 0, "Administrador do dispositivo: " + Jogo.nome(c, pk),
                              "Pode bloquear a tela, apagar o aparelho e dificulta a desinstalacao. Normal em apps de empresa/escola e localizadores; muito usado por malware para nao ser removido.",
                              pk, "admin", null));
                  }

                  // 4) Desenhar sobre outros apps
                  for (String pk : pacotes(Sh.run("appops query-op SYSTEM_ALERT_WINDOW allow"))) {
                      if (ignorar.contains(pk) || !usuario.contains(pk)) continue;
                      r.add(new Achado(1, "Pode desenhar sobre outros apps: " + Jogo.nome(c, pk),
                              "Consegue mostrar janelas por cima de qualquer app. Usado por bolhas de chat e gravadores, mas tambem por golpes de 'tela falsa' de banco.",
                              pk, "overlay", "SYSTEM_ALERT_WINDOW"));
                  }

                  // 5) Pode instalar outros apps
                  for (String pk : pacotes(Sh.run("appops query-op REQUEST_INSTALL_PACKAGES allow"))) {
                      if (ignorar.contains(pk) || !usuario.contains(pk)) continue;
                      r.add(new Achado(1, "Pode instalar outros apps: " + Jogo.nome(c, pk),
                              "Esse app tem permissao para instalar APKs. Navegadores e gerenciadores de arquivos costumam ter; se nao for o caso, revogue.",
                              pk, "overlay", "REQUEST_INSTALL_PACKAGES"));
                  }

                  // 6) Apps fora da loja e apps escondidos
                  Map<String, String> instalador = new HashMap<String, String>();
                  for (String linha : Sh.run("pm list packages -3 -i").split("\n")) {
                      String s = linha.trim();
                      if (!s.startsWith("package:")) continue;
                      String[] p = s.substring(8).split("\\s+");
                      String pk = p[0];
                      String ins = "null";
                      for (String x : p) if (x.startsWith("installer=")) ins = x.substring(10);
                      instalador.put(pk, ins);
                  }
                  List<String> foraDaLoja = new ArrayList<String>();
                  for (String pk : usuario) {
                      if (ignorar.contains(pk)) continue;
                      String ins = instalador.get(pk);
                      boolean desconhecido = ins == null || ins.equals("null") || ins.isEmpty();
                      boolean oculto = pm.getLaunchIntentForPackage(pk) == null;
                      if (oculto && desconhecido) {
                          r.add(new Achado(3, "App ESCONDIDO instalado fora da loja: " + Jogo.nome(c, pk),
                                  "Nao tem icone na tela inicial e nao veio de nenhuma loja. E o padrao classico de spyware/stalkerware e trojans. Se voce nao reconhece, desinstale.",
                                  pk, "oculto", null));
                      } else if (oculto) {
                          r.add(new Achado(1, "App sem icone: " + Jogo.nome(c, pk),
                                  "Esta instalado mas nao aparece na tela inicial. Pode ser um complemento normal (plugin, teclado, tema); confira se reconhece.",
                                  pk, "oculto", null));
                      } else if (desconhecido) {
                          foraDaLoja.add(Jogo.nome(c, pk));
                      }
                  }
                  if (!foraDaLoja.isEmpty()) {
                      Collections.sort(foraDaLoja);
                      r.add(new Achado(0, foraDaLoja.size() + " app(s) instalados fora da loja (APK)",
                              "Nao e problema por si so, mas APK de site/grupo e a forma mais comum de pegar virus no celular: " + join(foraDaLoja, ", "),
                              null, "info", null));
                  }

                  // 7) Depuracao
                  if ("1".equals(Sh.run("settings get global adb_enabled").trim())) {
                      r.add(new Achado(0, "Depuracao USB/sem fio ligada",
                              "Necessaria para o Shizuku funcionar. Quando nao estiver usando o Frio Toolkit, desligue nas Opcoes do desenvolvedor.",
                              null, "info", null));
                  }

                  Collections.sort(r, new Comparator<Achado>() {
                      public int compare(Achado a, Achado b) { return b.sev - a.sev; }
                  });
                  return r;
              }

              static String join(List<String> l, String sep) {
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < l.size(); i++) { if (i > 0) sb.append(sep); sb.append(l.get(i)); }
                  return sb.toString();
              }

              /** Desativa um servico de acessibilidade (guardado no Desfazer). */
              static String desativarAcessibilidade(Context c, String comp) {
                  String atual = Sh.run("settings get secure enabled_accessibility_services").trim();
                  List<String> manter = new ArrayList<String>();
                  for (String s : atual.split(":")) if (!s.trim().isEmpty() && !s.trim().equals(comp)) manter.add(s.trim());
                  String novo = join(manter, ":");
                  Mudancas.setting(c, Mudancas.FIXO, "secure", "enabled_accessibility_services", novo, "Servicos de acessibilidade");
                  if (manter.isEmpty()) Mudancas.setting(c, Mudancas.FIXO, "secure", "accessibility_enabled", "0", "Acessibilidade geral");
                  return "Acessibilidade desativada para " + comp.split("/")[0];
              }

              static String revogar(Context c, String pkg, String op) {
                  return Mudancas.aplicar(c, Mudancas.FIXO, "appop:" + pkg + ":" + op, "Permissao " + op + " de " + Jogo.nome(c, pkg),
                          "appops set " + pkg + " " + op + " deny", "appops set " + pkg + " " + op + " allow");
              }
          }
